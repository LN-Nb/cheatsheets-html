<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheatsheets GridSearch Classification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!-- KaTeX ne sert qu'à convertir le TeX en MathML natif : aucune feuille de style externe n'est nécessaire.
     Hors ligne, les formules s'affichent en TeX brut. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  /* Thème appliqué avant le premier rendu pour éviter un flash (partagé avec la fiche Régression). */
  try { var t = localStorage.getItem("csr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* =========================================================================
   Cheatsheets GridSearch · Classification
   Même structure que la fiche Régression : barre collante, sections à
   bandeau, accent par modèle, thème sombre et laboratoire de simulation.
   ========================================================================= */
:root {
  --ink: #14212b;
  --ink-2: #33424f;
  --muted: #5a6875;
  --line: #d6dde4;
  --line-2: #e7ecf0;
  --paper: #ffffff;
  --bg: #f1f4f7;
  --code-bg: #f3f5f8;
  --shadow: 0 1px 2px rgba(20, 33, 43, 0.05), 0 4px 14px rgba(20, 33, 43, 0.04);

  --ok: #17703f; --ok-soft: #e6f4eb; --ok-line: #b9dec7;
  --bad: #ad2620; --bad-soft: #fdecea; --bad-line: #f1c1bd;
  --warn: #855600; --warn-soft: #fff3d2; --warn-line: #ecd18b;
  --info: #1c5c9c; --info-soft: #e8f1fb; --info-line: #bcd4ee;

  --tok-str: #a23a12; --tok-num: #1257a6; --tok-kw: #7b2d9e; --tok-com: #66737f;

  /* séries des graphiques (palette catégorielle validée, ordre fixe) */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --c-err: #d03b3b;
  --c-fit: #14212b;
  --plot-grid: #e7ecf0;
  --plot-axis: #9aa6b1;
  --seq-lo: #e4eefb; --seq-hi: #104281;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-math: "STIX Two Math", "Cambria Math", "Latin Modern Math", math;

  --r-lg: 14px; --r-md: 10px; --r-sm: 6px;
  --gutter: clamp(16px, 3vw, 32px);
  --top-h: 112px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8edf1; --ink-2: #c4cdd5; --muted: #95a2ae; --line: #33404b; --line-2: #26313b;
    --paper: #161f27; --bg: #0f151b; --code-bg: #1c2731; --shadow: none;
    --ok: #5cc98a; --ok-soft: #12291c; --ok-line: #24553a;
    --bad: #f0807a; --bad-soft: #2f1615; --bad-line: #6a2b28;
    --warn: #e9bb5a; --warn-soft: #2c2210; --warn-line: #6a5121;
    --info: #79b2ee; --info-soft: #13243a; --info-line: #2b4d75;
    --tok-str: #f0a37f; --tok-num: #8cbcf5; --tok-kw: #d3a2f0; --tok-com: #8796a3;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #2f9a2f; --c7: #9085e9; --c8: #e66767;
    --c-err: #e66767; --c-fit: #f0f3f5; --plot-grid: #26313b; --plot-axis: #5f6d79;
    --seq-lo: #1b2836; --seq-hi: #86b6ef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8edf1; --ink-2: #c4cdd5; --muted: #95a2ae; --line: #33404b; --line-2: #26313b;
  --paper: #161f27; --bg: #0f151b; --code-bg: #1c2731; --shadow: none;
  --ok: #5cc98a; --ok-soft: #12291c; --ok-line: #24553a;
  --bad: #f0807a; --bad-soft: #2f1615; --bad-line: #6a2b28;
  --warn: #e9bb5a; --warn-soft: #2c2210; --warn-line: #6a5121;
  --info: #79b2ee; --info-soft: #13243a; --info-line: #2b4d75;
  --tok-str: #f0a37f; --tok-num: #8cbcf5; --tok-kw: #d3a2f0; --tok-com: #8796a3;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #2f9a2f; --c7: #9085e9; --c8: #e66767;
  --c-err: #e66767; --c-fit: #f0f3f5; --plot-grid: #26313b; --plot-axis: #5f6d79;
  --seq-lo: #1b2836; --seq-hi: #86b6ef;
  color-scheme: dark;
}

/* accent : une teinte de base par modèle, déclinaisons calculées */
.app { --acc: #1d5f8a; }
.app[data-model="logreg"] { --acc: #0e5f80; }
.app[data-model="rf"] { --acc: #0b7566; }
.app[data-model="xgb"] { --acc: #b8500a; }
.app[data-model="hgb"] { --acc: #5a3ec8; }
.app[data-view="lab"] { --acc: #1d5f8a; }
.app[data-view="cv"] { --acc: #22656e; }
.app[data-view="metrics"] { --acc: #8a4b12; }
.app[data-view="maths"] { --acc: #4b3fa8; }
.app {
  --accent: var(--acc);
  --accent-strong: color-mix(in oklab, var(--acc) 80%, #000);
  --accent-soft: color-mix(in oklab, var(--acc) 12%, var(--paper));
  --accent-softer: color-mix(in oklab, var(--acc) 5%, var(--paper));
  --accent-line: color-mix(in oklab, var(--acc) 32%, var(--paper));
  --on-accent: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .app {
    --accent: color-mix(in oklab, var(--acc) 70%, #fff);
    --accent-strong: color-mix(in oklab, var(--acc) 45%, #fff);
    --accent-soft: color-mix(in oklab, var(--acc) 26%, var(--paper));
    --accent-softer: color-mix(in oklab, var(--acc) 11%, var(--paper));
    --accent-line: color-mix(in oklab, var(--acc) 48%, var(--paper));
    --on-accent: #0f151b;
  }
}
:root[data-theme="dark"] .app {
  --accent: color-mix(in oklab, var(--acc) 70%, #fff);
  --accent-strong: color-mix(in oklab, var(--acc) 45%, #fff);
  --accent-soft: color-mix(in oklab, var(--acc) 26%, var(--paper));
  --accent-softer: color-mix(in oklab, var(--acc) 11%, var(--paper));
  --accent-line: color-mix(in oklab, var(--acc) 48%, var(--paper));
  --on-accent: #0f151b;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, figure, table, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-strong); text-underline-offset: 2px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
strong, b { font-weight: 600; color: var(--ink); }
/* icônes : taille par défaut, les composants la précisent */
svg[aria-hidden="true"] { width: 1.15em; height: 1.15em; flex: none; }
.widget__head svg, .detail__h svg { width: 18px; height: 18px; color: var(--accent); }

code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
p code, li code, td code, figcaption code, .note code, dd code, h4 code, label code, summary code {
  background: var(--code-bg); border: 1px solid var(--line-2); border-radius: 4px;
  padding: 0.05em 0.32em; overflow-wrap: break-word;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; color: var(--ink);
}
math { font-family: var(--font-math); }
math:not([display="block"]) { font-size: 1.12em; }
.tex-fallback { font-family: var(--font-mono); font-size: 0.85em; color: var(--ink-2); }

/* ------------------------------------------------------------- barre haute */
.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top__in { max-width: 1280px; margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; line-height: 1.2; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.views { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.view-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent;
  padding: 7px 12px; border-radius: 9px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
}
.view-btn svg { width: 17px; height: 17px; opacity: 0.85; }
.view-btn:hover { background: var(--code-bg); color: var(--ink); }
.view-btn[aria-current="page"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.top__tools { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; color: var(--ink-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent-strong); }

.tabs-row { border-top: 1px solid var(--line-2); }
.tabs-row .top__in { padding-block: 7px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
.tab { font-family: var(--font-mono); font-size: 12.5px !important; padding: 5px 11px !important; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
  font-weight: 500; font-size: 14px; color: var(--ink-2); white-space: nowrap; transition: background 0.12s, border-color 0.12s;
}
.tab::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); flex: none; }
.tab[data-m="logreg"] { --dot: #0e5f80; } .tab[data-m="rf"] { --dot: #0b7566; } .tab[data-m="xgb"] { --dot: #b8500a; } .tab[data-m="hgb"] { --dot: #5a3ec8; }
.tab:hover { border-color: var(--dot); }
.tab[aria-selected="true"] { background: var(--dot); border-color: var(--dot); color: #fff; font-weight: 600; }
.tab[aria-selected="true"]::before { background: #fff; }
.tab .tab__short { display: none; }
.view-btn .vl-short { display: none; }
.tab__grp { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; padding: 0 2px 0 6px; white-space: nowrap; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; white-space: nowrap; padding: 5px 13px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.seg--accent button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg--sm button { padding: 4px 10px; font-size: 13px; }

/* ------------------------------------------------------------------ pages */
.page { max-width: 1280px; margin: 0 auto; padding: 24px var(--gutter) 64px; display: grid; gap: 20px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 36px; align-items: center; padding: 6px 2px 2px; }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent-strong); }
.hero h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5.2vw, 56px); line-height: 1.02;
  letter-spacing: -0.03em; color: var(--accent-strong); margin: 6px 0 10px; text-wrap: balance; overflow-wrap: anywhere;
}
.hero__cls { font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.hero__cls b { color: var(--accent-strong); }
.hero__tag { font-size: 18.5px; line-height: 1.45; color: var(--ink-2); max-width: 48ch; margin-top: 10px; text-wrap: pretty; }
.hero__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent-line); background: var(--accent-softer); color: var(--accent-strong); border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 500; }
.schema { background: var(--paper); border: 1px solid var(--accent-line); border-radius: var(--r-lg); padding: 14px 16px 12px; box-shadow: var(--shadow); min-width: 0; }
.schema figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

.jump { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.jump > span { font-size: 13px; color: var(--muted); margin-right: 4px; }
.jump button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; color: var(--ink-2); }
.jump button:hover { border-color: var(--accent); color: var(--accent-strong); }

/* --------------------------------------------------------------- sections */
.sec { background: var(--paper); border: 1px solid var(--accent-line); border-radius: var(--r-lg); overflow: clip; scroll-margin-top: calc(var(--top-h) + 14px); min-width: 0; box-shadow: var(--shadow); }
.sec__head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--accent-soft); color: var(--accent-strong); flex-wrap: wrap; }
.sec__head h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.sec__ico { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.sec__ico svg { width: 18px; height: 18px; }
.sec__aside { margin-left: auto; font-size: 13px; color: var(--accent-strong); }
.sec--solid > .sec__head { background: var(--accent); color: var(--on-accent); }
.sec--solid > .sec__head .sec__ico { background: color-mix(in srgb, var(--on-accent) 18%, transparent); color: var(--on-accent); }
.sec--solid > .sec__head .sec__aside { color: var(--on-accent); }
.sec__body { padding: 18px 20px 20px; display: grid; gap: 18px; min-width: 0; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; align-content: start; }
.sub { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); line-height: 1.55; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 75ch; text-wrap: pretty; line-height: 1.6; }
.prose { display: grid; gap: 10px; max-width: 78ch; }
.prose p, .prose li { font-size: 15.5px; color: var(--ink-2); text-wrap: pretty; }

.tag { display: inline-block; vertical-align: 1px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 0 5px; line-height: 1.55; margin-left: 6px; white-space: nowrap; border: 1px solid; }
.tag--add { color: var(--info); background: var(--info-soft); border-color: var(--info-line); }
.tag--reco { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.tag--new { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.tag--dep { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.tag--fix { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.tag--pdf { color: var(--ink-2); background: var(--code-bg); border-color: var(--line); }

/* matrice solveur × pénalité */
.matrix { font-size: 14px; }
.matrix th, .matrix td { padding: 7px 10px; text-align: center; border-top: 1px solid var(--line-2); }
.matrix thead th { background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; font-weight: 600; border-top: 0; white-space: nowrap; }
.matrix th[scope="row"] { text-align: left; font-family: var(--font-mono); font-weight: 600; color: var(--accent-strong); white-space: nowrap; }
.yes { color: var(--ok); font-weight: 600; } .no { color: var(--muted); }

/* recherche progressive (HistGradientBoosting) */
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: st; }
.step { border: 1px solid var(--accent-line); border-radius: var(--r-md); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; background: var(--paper); counter-increment: st; min-width: 0; }
.step .btn { align-self: flex-start; margin-top: auto; }
.step__k { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-strong); }
.step__k::before { content: "Étape " counter(st); }
.step h3 { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.step p { font-size: 14px; color: var(--ink-2); text-wrap: pretty; }
.step dl { display: grid; gap: 3px; font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg); border-radius: var(--r-sm); padding: 8px 10px; overflow-x: auto; }
.step dl div { display: flex; gap: 8px; white-space: nowrap; } .step dt { color: var(--accent-strong); font-weight: 600; } .step dd { margin: 0; color: var(--ink-2); }
.step__n { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; } .step__n b { font-family: var(--font-display); font-size: 22px; color: var(--accent-strong); }

/* corrections */
.fixes { display: grid; gap: 8px; }
.fixes li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; font-size: 14.5px; color: var(--ink-2); padding-top: 8px; border-top: 1px solid var(--line-2); text-wrap: pretty; }
.fixes li:first-child { border-top: 0; padding-top: 0; }
.fixes .src { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bad); padding-top: 3px; }

/* matrice de confusion */
.cm { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; max-width: 340px; }
.cm > span { color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: grid; place-items: center; padding: 2px 6px; text-align: center; }
.cm > b { display: grid; place-items: center; border-radius: 8px; padding: 10px 6px; font-family: var(--font-display); font-size: 21px; line-height: 1.1; border: 1px solid var(--line-2); }
.cm > b small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--ink-2); }
.cm .ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.cm .ko { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }

/* principe + formules */
.prin { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 28px; }
.prin li { position: relative; padding-left: 18px; font-size: 15.5px; color: var(--ink-2); text-wrap: pretty; }
.prin li::before { content: ""; position: absolute; left: 0; top: 0.66em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.brief { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 28px; }
.brief p { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 15px; color: var(--ink-2); }
.brief svg { width: 18px; height: 18px; margin-top: 3px; }
.brief__p svg { color: var(--ok); } .brief__c svg { color: var(--bad); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.fcard { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 13px 15px 14px; display: grid; gap: 9px; align-content: start; min-width: 0; background: var(--paper); }
.fcard h3 { font-size: 14.5px; font-weight: 600; color: var(--accent-strong); }
.fbox { background: var(--accent-softer); border-radius: var(--r-sm); padding: 12px 10px; overflow-x: auto; text-align: center; font-size: 17px; min-height: 66px; display: grid; place-items: center; }
.fcard p { font-size: 14px; color: var(--ink-2); text-wrap: pretty; }
.fcard .idx { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 7px; }

/* -------------------------------------------------------- tableaux */
.tablewrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; }
.ptable, .rtable, .mtable { font-size: 14px; line-height: 1.45; }
.ptable th, .rtable th, .mtable th {
  text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--accent-strong); background: var(--accent-soft); padding: 9px 11px; white-space: nowrap;
}
.ptable td, .rtable td, .mtable td { padding: 9px 11px; border-top: 1px solid var(--line-2); vertical-align: top; color: var(--ink-2); }
.ptable tr.prow:hover td { background: var(--accent-softer); }
.ptable tr.prow.is-open td { background: var(--accent-softer); }
.pname { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--accent-strong); text-align: left; }
.pname svg { width: 12px; height: 12px; flex: none; transition: transform 0.15s; color: var(--muted); }
.pname[aria-expanded="true"] svg { transform: rotate(90deg); color: var(--accent); }
.pname:hover span { text-decoration: underline; text-underline-offset: 3px; }
.pname small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 12px; }
.vals { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.vals .s { color: var(--tok-str); } .vals .n { color: var(--tok-num); } .vals .k { color: var(--tok-kw); }
.ptable .c-vals { min-width: 150px; } .ptable .c-role { min-width: 150px; } .ptable .c-up { min-width: 200px; }
.ptable .c-fit, .ptable .c-prio { white-space: nowrap; }
.fit { display: inline-block; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 9px; border: 1px solid; white-space: nowrap; }
.fit--cx { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.fit--reg { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.fit--stab { color: var(--info); background: var(--info-soft); border-color: var(--info-line); }
.fit--neu { color: var(--ink-2); background: var(--code-bg); border-color: var(--line); }
.prio { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid var(--accent); }
.prio--1 { background: var(--accent); color: var(--on-accent); }
.prio--2 { background: var(--paper); color: var(--accent-strong); }
.prio--3 { background: var(--paper); color: var(--muted); border-color: var(--line); font-weight: 600; }
.pdetail td { padding: 0 11px 13px; border-top: 0; background: var(--accent-softer); }
.pd { background: var(--paper); border: 1px solid var(--accent-line); border-radius: var(--r-md); padding: 13px 15px; display: grid; gap: 10px; }
.pd__meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--ink-2); }
.pd__meta b { font-weight: 600; color: var(--muted); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 6px; }
.pd__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px 24px; }
.pd h4 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-strong); margin-bottom: 3px; }
.pd p, .pd li { font-size: 14px; color: var(--ink-2); }
.pd ul { display: grid; gap: 4px; }
.pd ul li { position: relative; padding-left: 14px; }
.pd ul li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }

/* référence complète */
.rtools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.search { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; background: var(--paper); min-width: min(100%, 280px); }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 14px; }
.rtable td.c-n { font-family: var(--font-mono); font-weight: 600; color: var(--accent-strong); white-space: nowrap; }
.rtable td.c-d { font-family: var(--font-mono); font-size: 13px; color: var(--ink); white-space: nowrap; }
.rtable td.c-v { font-family: var(--font-mono); font-size: 12.5px; min-width: 170px; }
.rtable td.c-x { min-width: 280px; }
.rtable tr.grp td { background: var(--code-bg); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 7px 11px; }
.gs { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 0 8px; border: 1px solid; white-space: nowrap; }
.gs--y { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.gs--m { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.gs--n { color: var(--muted); background: var(--code-bg); border-color: var(--line); }
.rcount { font-size: 13px; color: var(--muted); }

/* listes */
.checks { display: grid; gap: 9px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; font-size: 15px; color: var(--ink-2); text-wrap: pretty; }
.checks li > svg { width: 18px; height: 18px; margin-top: 3px; color: var(--accent); }
.checks--bad li > svg { color: var(--bad); }
.nums { display: grid; gap: 10px; counter-reset: n; }
.nums li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 15px; color: var(--ink-2); counter-increment: n; text-wrap: pretty; }
.nums li::before { content: counter(n); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.dots { display: grid; gap: 7px; }
.dots li { position: relative; padding-left: 16px; font-size: 15px; color: var(--ink-2); text-wrap: pretty; }
.dots li::before { content: ""; position: absolute; left: 2px; top: 0.64em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.box { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 13px 15px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.box--soft { background: var(--accent-softer); border-color: var(--accent-line); }
.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; border-radius: var(--r-md); padding: 10px 13px; font-size: 14.5px; border: 1px solid; color: var(--ink); }
.callout svg { width: 18px; height: 18px; margin-top: 3px; }
.callout--bad { background: var(--bad-soft); border-color: var(--bad-line); } .callout--bad svg { color: var(--bad); }
.callout--warn { background: var(--warn-soft); border-color: var(--warn-line); } .callout--warn svg { color: var(--warn); }
.callout--info { background: var(--info-soft); border-color: var(--info-line); } .callout--info svg { color: var(--info); }
.callout--ok { background: var(--ok-soft); border-color: var(--ok-line); } .callout--ok svg { color: var(--ok); }
.pc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pc > div { border-radius: var(--r-md); padding: 13px 15px; border: 1px solid; }
.pc > .pc__p { background: var(--ok-soft); border-color: var(--ok-line); }
.pc > .pc__c { background: var(--bad-soft); border-color: var(--bad-line); }
.pc h3 { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 600; margin-bottom: 8px; }
.pc__p h3 { color: var(--ok); } .pc__c h3 { color: var(--bad); }
.pc h3 svg { width: 20px; height: 20px; }
.pc ul { display: grid; gap: 6px; }
.pc li { position: relative; padding-left: 15px; font-size: 15px; color: var(--ink); text-wrap: pretty; }
.pc li::before { content: ""; position: absolute; left: 1px; top: 0.64em; width: 6px; height: 6px; border-radius: 50%; }
.pc__p li::before { background: var(--ok); } .pc__c li::before { background: var(--bad); }
.qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.qa > div { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 13px 15px; }
.qa h4 { font-size: 15px; font-weight: 600; color: var(--accent-strong); margin-bottom: 4px; text-wrap: balance; }
.qa p { font-size: 14.5px; color: var(--ink-2); text-wrap: pretty; }
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: s; }
.pipe li { border: 1px solid var(--accent-line); background: var(--accent-softer); border-radius: var(--r-md); padding: 11px 13px 13px; counter-increment: s; font-size: 14px; color: var(--ink-2); }
.pipe li b { display: block; font-family: var(--font-display); font-size: 16px; color: var(--accent-strong); margin-bottom: 3px; }
.pipe li b::before { content: counter(s) ". "; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; background: var(--paper); }
.card h3 { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.card h3 code { font-family: var(--font-mono); font-size: 0.82em; color: var(--accent-strong); }
.card p { font-size: 14.5px; color: var(--ink-2); text-wrap: pretty; }
.card .when { font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); padding-left: 10px; }

/* -------------------------------------------------------- bloc de code */
.code { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--code-bg); overflow: hidden; min-width: 0; }
.code__bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); background: var(--paper); }
.code__bar > span { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--accent:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--paper); }
.btn.is-done { border-color: var(--ok); color: var(--ok); }
.code pre { margin: 0; padding: 12px 14px; overflow: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.62; color: var(--ink); tab-size: 4; max-height: 560px; }
.code pre .s { color: var(--tok-str); } .code pre .n { color: var(--tok-num); } .code pre .k { color: var(--tok-kw); } .code pre .c { color: var(--tok-com); font-style: italic; }

/* ------------------------------------------------------- constructeur */
.builder { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.b-left { display: grid; gap: 14px; min-width: 0; }
.b-right { display: grid; gap: 10px; min-width: 0; position: sticky; top: calc(var(--top-h) + 12px); max-height: calc(100vh - var(--top-h) - 28px); overflow-y: auto; overscroll-behavior: contain; }
.b-right .code pre { max-height: none; }
.b-opts { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: grid; gap: 4px; }
.field > label, .field > .lab { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.field input[type="number"], .field select, select.sel {
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--paper); font-size: 14px; font-variant-numeric: tabular-nums;
}
.field input[type="number"] { width: 84px; }
.b-rows { display: grid; border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; }
.brow { display: grid; grid-template-columns: 180px minmax(0, 1fr) auto; gap: 6px 12px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--line-2); }
.brow:first-child { border-top: 0; }
.brow.is-on { background: var(--accent-softer); }
.brow__name { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; color: var(--accent-strong); padding-top: 4px; overflow-wrap: anywhere; }
.brow__name small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.brow__vals { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.vchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 3px 9px; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); min-height: 28px; }
.vchip::before { content: ""; width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--muted); flex: none; }
.vchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.vchip[aria-pressed="true"]::before { border-color: var(--on-accent); background: var(--on-accent); }
.vchip:hover { border-color: var(--accent); }
.addv { display: inline-flex; gap: 4px; align-items: center; }
.addv input { width: 84px; border: 1px dashed var(--muted); border-radius: 7px; padding: 3px 7px; font-family: var(--font-mono); font-size: 12.5px; min-height: 28px; background: var(--paper); }
.addv button { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; min-height: 28px; padding: 0 9px; font-size: 13px; font-weight: 600; color: var(--accent-strong); }
.brow__n { font-size: 12.5px; font-weight: 600; color: var(--muted); padding-top: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 50px; text-align: right; }
.brow.is-on .brow__n { color: var(--accent-strong); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--accent-line); background: var(--accent-softer); border-radius: var(--r-md); padding: 8px 12px 9px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--accent-strong); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: 12.5px; color: var(--ink-2); }
.stats__eq { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.alerts { display: grid; gap: 6px; }
.alerts:empty { display: none; }
.alerts .callout { font-size: 13.5px; padding: 8px 11px; }

/* --------------------------------------------------------- laboratoire */
.lab { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.ctl { min-width: 0; } .ctl .seg { max-width: 100%; }
.panel { display: grid; gap: 14px; min-width: 0; align-content: start; }
.ctl { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 12px; background: var(--paper); }
.ctl h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rng { display: grid; gap: 3px; }
.rng__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13.5px; color: var(--ink-2); }
.rng__top output { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
.rng input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; height: 22px; }
.rng small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.toggles { display: grid; gap: 6px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.swatch--line { width: 16px; height: 3px; border-radius: 2px; }
.swatch--ring { background: transparent !important; border: 2px solid; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 8px 12px; background: var(--paper); min-width: 0; }
.metric span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.metric b { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.metric small { display: block; font-size: 12px; color: var(--muted); }
.diag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14.5px; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; border: 1px solid; }
.badge svg { width: 15px; height: 15px; }
.badge--ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.badge--warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.badge--bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.badge--info { color: var(--info); background: var(--info-soft); border-color: var(--info-line); }

/* graphiques SVG */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: manipulation; }
.chart--click svg { cursor: crosshair; }
.chart__title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 4px; }
.chart__title h3, .chart__title h4 { font-size: 14.5px; font-weight: 600; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg text { font-family: var(--font-body); fill: var(--muted); font-size: 11.5px; }
svg text.t-ink { fill: var(--ink); } svg text.t-ink2 { fill: var(--ink-2); }
svg text.t-b { font-weight: 600; } svg text.t-mono { font-family: var(--font-mono); }
svg text.t-halo { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.p-grid { stroke: var(--plot-grid); stroke-width: 1; }
.p-axis { stroke: var(--plot-axis); stroke-width: 1; }
.tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--paper);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  font-variant-numeric: tabular-nums; max-width: 260px; opacity: 0; transition: opacity 0.08s;
}
.tip.is-on { opacity: 1; }
.tip b { color: var(--paper); }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.dec { display: grid; gap: 6px; }
.dec__row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 74px; gap: 10px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.dec__bar { height: 18px; background: var(--code-bg); border-radius: 4px; overflow: hidden; position: relative; }
.dec__bar i { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; min-width: 2px; transition: width 0.25s; }
.dec__row b { font-family: var(--font-mono); font-size: 13px; text-align: right; color: var(--ink); font-weight: 600; }
.foldlist { display: grid; gap: 4px; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.kpi-row b { font-family: var(--font-display); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--code-bg); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.1s; }

/* ------------------------------------------------------ mathématiques */
.mtoc { display: flex; flex-wrap: wrap; gap: 6px; }
.mtopic .sec__body { gap: 16px; }
.simple { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px 26px; align-items: start; }
.simple__txt { display: grid; gap: 10px; }

.detail { border-top: 1px dashed var(--accent-line); padding-top: 16px; display: grid; gap: 16px; }

.steps { display: grid; gap: 12px; counter-reset: st; }
.steps > li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; counter-increment: st; }
.steps > li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent-strong); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.steps > li > div { display: grid; gap: 6px; min-width: 0; }
.steps p { font-size: 15px; color: var(--ink-2); text-wrap: pretty; }
.steps .fx { overflow-x: auto; font-size: 17px; padding: 2px 0; }
.widget { border: 1px solid var(--accent-line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 12px; background: var(--paper); min-width: 0; }
.widget__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.widget__head h4 { font-size: 15px; font-weight: 600; color: var(--ink); }
.widget__head .pill { margin-left: auto; }
.wgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 16px; align-items: start; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--accent-line); color: var(--accent-strong); background: var(--accent-softer); white-space: nowrap; }

.readout b { font-family: var(--font-mono); color: var(--ink); }

.foot { font-size: 13px; color: var(--muted); text-align: center; padding: 4px 0 0; max-width: 80ch; margin: 0 auto; }

      (o.hint ? "<small>" + o.hint + "</small>" : "") + "</div>";
  }
  const seg = (name, cur, opts, cls) => '<div class="seg seg--sm ' + (cls || "seg--accent") + '" role="group" data-seg="' + name + '">' + opts.map((o) => '<button type="button" data-val="' + o[0] + '" aria-pressed="' + (String(o[0]) === String(cur)) + '">' + o[1] + "</button>").join("") + "</div>";
  const chk = (id, label, on, swatch) => '<label class="chk"><input type="checkbox" id="' + id + '"' + (on ? " checked" : "") + ">" + (swatch || "") + "<span>" + label + "</span></label>";
  const swatch = (c, kind) => '<span class="swatch' + (kind ? " swatch--" + kind : "") + '" style="' + (kind === "ring" ? "border-color:" : "background:") + c + '"></span>';
  function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }

  /* ----------------------------------------------------------------- état */
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("csc-state") || "{}"); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem("csc-state", JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
  };
  const saved = store.get();
  const VIEWS = [
    ["models", "Fiches modèles", "book", "Fiches"],
    ["lab", "Labo", "flask", "Labo"],
    ["cv", "Validation & GridSearch", "split", "Validation"],
    ["metrics", "Métriques", "gauge", "Métriques"],
    ["maths", "Mathématiques", "sigma", "Maths"],
  ];
  const HASH = { models: "fiche", lab: "labo", cv: "validation", metrics: "metriques", maths: "maths" };
  const byId = (id) => MODELS.find((m) => m.id === id);
  const state = {
    view: "models",
    model: byId(saved.model) ? saved.model : "logreg",
    mode: saved.mode === "detailed" ? "detailed" : "essential",
    b: {},
    open: {},
    opts: Object.assign({ search: "grid", folds: 5, nIter: 30, cv: "skf", refit: "pr_auc", api: "l1ratio", codeMode: "full" }, saved.opts || {}),
  };
  function readHash() {
    const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const [a, b] = h.split("/");
    const v = Object.keys(HASH).find((k) => HASH[k] === a);
    if (v) state.view = v;
    if (v === "models" && byId(b)) state.model = b;
    return b;
  }
  function writeHash(extra) {
    const h = "#" + HASH[state.view] + (state.view === "models" ? "/" + state.model : extra ? "/" + extra : "");
    try { history.replaceState(null, "", h); } catch (e) { /* cadre sans historique */ }
  }
  const persist = () => store.set({ view: state.view, model: state.model, mode: state.mode, opts: state.opts });

  /* -------------------------------------------------------------- thème */
  function themeIcon() {
    const t = document.documentElement.dataset.theme;
    const b = $("#theme-btn");
    b.innerHTML = t === "dark" ? ICON.moon : t === "light" ? ICON.sun : ICON.auto;
    b.setAttribute("aria-label", "Thème : " + (t === "dark" ? "sombre" : t === "light" ? "clair" : "automatique") + " (cliquer pour changer)");
    b.title = b.getAttribute("aria-label");
  }
  function cycleTheme() {
    const t = document.documentElement.dataset.theme, next = !t ? "light" : t === "light" ? "dark" : "";
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    try { if (next) localStorage.setItem("csr-theme", next); else localStorage.removeItem("csr-theme"); } catch (e) { /* ignore */ }
    themeIcon();
    if (typeof onThemeChange === "function") onThemeChange();
  }

  /* ==========================================================================
     Rubrique « Fiches modèles »
     ========================================================================== */

  /* ------------------------------------------- schémas du bandeau (calculés) */
  const SCH = { w: 440, h: 250, m: { t: 14, r: 14, b: 30, l: 36 } };
  const lineOf = (f, a, b, n) => ENG.range(n + 1).map((i) => { const x = a + ((b - a) * i) / n; return [x, f(x)]; });
  // jeu à une variable : P(y = 1 | x) = σ(12(x − 0,5)) avec une bosse
  const ONE_D = (() => {
    const r = ENG.rng(8), X = [], y = [];
    for (let i = 0; i < 70; i++) { const x = r(); const p = ENG.sigmoid(12 * (x - 0.45)) * (x > 0.8 ? 0.55 : 1); X.push([x, 0.5]); y.push(r() < p ? 1 : 0); }
    return { X, y };
  })();
  const dots1D = (P, D) => D.X.forEach((x, i) => P.dot(x[0], D.y[i] ? 1.04 : -0.04, 3.6, "fill:" + (D.y[i] ? "var(--c2)" : "var(--c1)") + ";fill-opacity:.75"));

  function schemaLogreg() {
    const P = VIZ.Plot(Object.assign({}, SCH, { x: [-6, 6], y: [-0.08, 1.08], xlabel: "score z = wᵀx + b", ylabel: "p = σ(z)", m: { t: 16, r: 14, b: 32, l: 36 } }));
    P.grid(6, 4).hline(0.5, "stroke:var(--muted);stroke-dasharray:5 4", "seuil 0,5").vline(0, "stroke:var(--muted);stroke-dasharray:5 4");
    P.area(lineOf(ENG.sigmoid, 0, 6, 60).map((p) => [p[0], p[1], 0.5]), "fill:var(--c2);fill-opacity:.12");
    P.area(lineOf(ENG.sigmoid, -6, 0, 60).map((p) => [p[0], 0.5, p[1]]), "fill:var(--c1);fill-opacity:.12");
    P.path(lineOf(ENG.sigmoid, -6, 6, 200), "stroke:var(--accent);stroke-width:3");
    P.text(3.2, 0.2, "classe 1 si z > 0", "t-halo t-ink2 t-b", "middle").text(-3.2, 0.82, "classe 0 si z < 0", "t-halo t-ink2 t-b", "middle");
    return P.svg("Sigmoïde : le score linéaire z devient une probabilité ; au seuil 0,5, la frontière est z = 0.");
  }
  function schemaRf() {
    const f = ENG.fit("rf", ONE_D.X, ONE_D.y, { trees: 40, depth: 6, leaf: 2, mf: 2, seed: 3 });
    const P = VIZ.Plot(Object.assign({}, SCH, { x: [0, 1], y: [-0.08, 1.08], xlabel: "x", ylabel: "P(y = 1)" }));
    P.grid(5, 4);
    f.trees.slice(0, 6).forEach((t) => P.path(lineOf((x) => t([x, 0.5]), 0, 1, 240), "stroke:var(--c3);stroke-width:1.1;stroke-opacity:.5"));
    dots1D(P, ONE_D);
    P.path(lineOf((x) => f([x, 0.5]), 0, 1, 240), "stroke:var(--c-fit);stroke-width:2.6");
    return P.svg("Six arbres (traits fins) et la probabilité moyenne de la forêt (trait épais).");
  }
  function schemaBoost() {
    const f = ENG.fitBoost(ONE_D.X, ONE_D.y, { rounds: 60, lr: 0.3, gdepth: 1 });
    const P = VIZ.Plot(Object.assign({}, SCH, { x: [0, 1], y: [-0.08, 1.08], xlabel: "x", ylabel: "P(y = 1)" }));
    P.grid(5, 4);
    dots1D(P, ONE_D);
    [[0, ".35", "F₀"], [2, ".5", "F₂"], [8, ".75", "F₈"], [60, "1", "F₆₀"]].forEach((s, k) => {
      const g = (x) => f([x, 0.5], s[0]);
      P.path(lineOf(g, 0, 1, 240), "stroke:var(--accent);stroke-width:" + (1.2 + k * 0.5) + ";stroke-opacity:" + s[1]);
      P.text(0.02, g(0.02), s[2], "t-halo t-ink2 t-b", "start", -6);
    });
    return P.svg("Boosting : la probabilité part de la fréquence de base F0 et s'ajuste à chaque round.");
  }
  function schemaHgb() {
    const r = ENG.rng(21), v = [];
    for (let i = 0; i < 400; i++) v.push(Math.exp(0.55 * ENG.gauss(r)) * 10);
    v.sort((a, b) => a - b);
    const nb = 10, edges = ENG.range(nb + 1).map((i) => (i === 0 ? 0 : i === nb ? 40 : v[Math.floor((i * v.length) / nb)]));
    const P = VIZ.Plot(Object.assign({}, SCH, { x: [0, 40], y: [0, 0.2], xlabel: "valeur de la variable", ylabel: "densité" }));
    P.grid(5, 4);
    for (let i = 0; i < nb; i++) { const w = edges[i + 1] - edges[i]; P.rect(edges[i] + 0.15, 0, edges[i + 1] - 0.15, Math.min(0.2, 0.1 / w), "fill:var(--accent);fill-opacity:" + (0.35 + (i % 2) * 0.3) + ";rx:3"); }
    v.filter((_, i) => i % 5 === 0).forEach((x) => P.seg(x, 0, x, 0.008, "stroke:var(--ink-2);stroke-width:1;stroke-opacity:.6"));
    P.text(30, 0.17, "10 bins de même effectif", "t-halo t-ink2", "middle");
    return P.svg("Binning par quantiles : les coupures ne sont cherchées qu'entre les bornes des bins.");
  }
  const SCHEMA = { logreg: schemaLogreg, rf: schemaRf, xgb: schemaBoost, hgb: schemaHgb };

  /* ------------------------------------------------------------ sections */
  function hero(m) {
    return '<header class="hero"><div>' +
      '<p class="eyebrow">Fiche modèle · Classification · préparation GridSearch</p>' +
      "<h1>" + esc(m.label) + "</h1>" +
      '<p class="hero__cls">' + esc(m.module) + ".<b>" + esc(m.cls) + "</b></p>" +
      '<p class="hero__tag">' + fmt(m.tagline) + "</p>" +

      '<div class="hero__actions no-print"><button type="button" class="btn btn--accent" data-open-lab="' + m.lab + '">' + ICON.flask + "<span>Simuler dans le Labo</span></button>" +
      '<button type="button" class="btn" data-jump="sec-grid">' + ICON.grid + "<span>Construire la grille</span></button>" +

  const lvlCls = (x) => (x.lvl === "d" ? ' class="only-detail"' : "");
  function understand(m) {
    const prin = '<ul class="prin">' + m.principle.map((p) => "<li>" + fmt(p.t) + tag(p.tag) + "</li>").join("") + "</ul>";
    const cards = m.formulas.map((f) =>

    const more = m.formulas.filter((f) => f.lvl === "d").length;
    return section("sec-understand", "sigma", "Comprendre le modèle",
      prin + '<div class="brief"><p class="brief__p">' + ICON.check + "<span><b>Atout principal.</b> " + fmt(m.pros[0]) + '</span></p><p class="brief__c">' + ICON.cross + "<span><b>Limite principale.</b> " + fmt(m.cons[0]) + "</span></p></div>" +
      '<div class="fgrid">' + cards + "</div>" +

  }
  const keyParams = (m) => m.params.filter((p) => p.tier === "grid");
  function params(m) {
    const open = state.open[m.id] || {};
    const rows = keyParams(m).map((p) => {
      const id = "pd-" + m.id + "-" + p.n, isOpen = !!open[p.n];
      return '<tr class="prow' + (isOpen ? " is-open" : "") + '">' +
        '<td class="c-name"><button type="button" class="pname" data-pd="' + p.n + '" aria-expanded="' + isOpen + '" aria-controls="' + id + '">' + ICON.chev + "<span>" + wb(p.n) + "</span></button>" + tag(p.tag) + "</td>" +
        '<td class="c-role">' + fmt(p.role) + "</td>" +
        '<td class="c-vals" data-l="Départ"><span class="vals">' + hlPy(pyList(p.start)) + "</span></td>" +
        '<td class="c-fit" data-l="Sens"><span class="fit fit--' + p.fit[0] + '">' + esc(p.fit[1]) + "</span></td>" +
        '<td class="c-up only-detail" data-l="Effet">' + fmt(p.up) + "</td>" +
        '<td class="c-prio"><span class="prio prio--' + p.prio + '" title="Priorité ' + p.prio + '">P' + p.prio + "</span></td></tr>" +
        '<tr class="pdetail" id="' + id + '"' + (isOpen ? "" : " hidden") + '><td colspan="6">' + paramDetail(p) + "</td></tr>";
    }).join("");
    return section("sec-params", "sliders", "Hyperparamètres clés pour le GridSearch",
      '<p class="note"><span class="no-print">Cliquer sur un paramètre pour savoir quand l\'ajuster, comment lire sa valeur et les erreurs à éviter. </span>Les valeurs de départ sont des plages exploratoires, pas des optimums universels.</p>' +
      '<div class="tablewrap"><table class="ptable"><thead><tr><th scope="col">Paramètre</th><th scope="col">Rôle</th><th scope="col">Valeurs de départ</th><th scope="col">Sens</th><th scope="col" class="only-detail">Effet d\'une hausse</th><th scope="col">Priorité</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="legend"><span><span class="fit fit--cx">↑ plus complexe</span> risque de surapprentissage</span><span><span class="fit fit--reg">↑ plus régularisé</span> modèle plus simple</span><span><span class="fit fit--stab">↑ plus stable</span> sans risque, coûte du temps</span><span><span class="prio prio--1">P1</span> à régler d\'abord</span><span><span class="tag tag--fix" style="margin:0">Corrigé</span> rectifié par rapport aux sources</span></div>',
      { cls: "sec--solid", aside: keyParams(m).length + " paramètres clés · " + m.ref.reduce((a, g) => a + g[1].length, 0) + " dans la référence complète" });
  }
  function paramDetail(p) {
    return '<div class="pd"><div class="pd__meta"><span><b>Défaut</b><code>' + esc(p.def) + "</code></span><span><b>Clé dans la grille</b><code>" + esc(p.k) + "</code></span><span><b>Priorité</b>" + ["", "1 — fondamental", "2 — à régler ensuite", "3 — secondaire"][p.prio] + "</span>" +
      (p.tagDetail ? "<span><b>Conseils</b>" + (p.tagDetail === "reco" ? "recommandations pratiques" : "vérifiés dans la doc ou par exécution") + tag(p.tagDetail) + "</span>" : "") + "</div>" +
      (p.tagNote ? callout("bad", "<strong>Corrigé.</strong> " + fmt(p.tagNote)) : "") +
      '<div class="pd__grid"><div><h4>Quand l\'ajuster</h4><p>' + fmt(p.when) + "</p></div><div><h4>Lire sa valeur</h4><p>" + fmt(p.read) + "</p></div>" +

  }
  const GS = { y: ["gs--y", "à régler"], m: ["gs--m", "selon le cas"], n: ["gs--n", "à fixer"] };

    return section("sec-ref", "list", "Référence complète des paramètres",
      '<p class="note">Tous les paramètres du constructeur, avec leur valeur par défaut et les valeurs acceptées' + (m.xgb ? ", plus les principaux paramètres natifs XGBoost" : "") + ". Vérifié avec " + (m.xgb ? "XGBoost " + VERSIONS.xgboost : "scikit-learn " + VERSIONS.sklearn) + ".</p>" +
      '<div class="rtools no-print"><label class="search">' + ICON.search + '<span class="vh">Filtrer les paramètres</span><input type="search" id="ref-q" placeholder="Filtrer : classe, profondeur, NaN…" autocomplete="off"></label><span class="rcount" id="ref-n">' + total + " paramètres</span></div>" +
      '<div class="tablewrap"><table class="rtable"><thead><tr><th scope="col">Paramètre</th><th scope="col">Défaut</th><th scope="col">Valeurs acceptées</th><th scope="col">Rôle</th><th scope="col">GridSearch</th></tr></thead><tbody>' + rows + "</tbody></table></div>",

  const checkList = (items, bad) => '<ul class="checks' + (bad ? " checks--bad" : "") + '">' + items.map((c) => "<li" + lvlCls(c) + ">" + (bad ? ICON.cross : ICON.check) + "<span>" + fmt(c.t) + tag(c.tag) + "</span></li>").join("") + "</ul>";
  function matrix(m) {

      (m.solverMatrix ? matrix(m) : "") + checkList(m.compat) + (hidden ? '<p class="note only-essential">' + hidden + " précautions supplémentaires en mode Détaillé.</p>" : "")) +
      '<div class="stack">' + (m.prep ? section("sec-prep", "prep", esc(m.prep.title), checkList(m.prep.items)) : "") +
      section("sec-prio", "target", "Réglages prioritaires",
        '<div><p class="sub">À optimiser en premier</p><ol class="nums" style="margin-top:8px">' + p.core.map((x) => "<li><span>" + fmt(x.t) + "</span></li>").join("") + "</ol></div>" +
        '<div><p class="sub">Ensuite</p><ul class="dots" style="margin-top:8px">' + p.side.map((x) => "<li>" + fmt(x.t) + "</li>").join("") + "</ul></div>" +
        (p.note ? '<p class="note">' + fmt(p.note) + "</p>" : "") + (m.metricNote ? callout("info", "<strong>Métriques.</strong> " + fmt(m.metricNote)) : "")) + "</div></div>";
  }
  function flow(m) {
    const wf = m.workflow, f = state.opts.folds, n = (grid) => grid.reduce((a, e) => a * e[1].length, 1);
    const steps = wf.steps.map((s) => {
      const c = n(s.grid);
      return '<li class="step"><span class="step__k"></span><h3>' + esc(s.title) + "</h3><p>" + fmt(s.goal) + "</p>" +

      callout("info", fmt("Coût comparé avec " + f + " folds : recherche exhaustive des 5 paramètres = **" + nf(full * f) + "** fits ; étapes 1 + 2 = **" + nf(prog * f) + "** fits. " + (wf.random || ""))) +
      (wf.es ? '<div class="box"><p class="sub">' + esc(wf.es.title) + "</p>" + callout("ok", "<strong>Choix vérifié.</strong> " + fmt(wf.es.verdict)) + '<p class="note">' + fmt(wf.es.why) + "</p></div>" : ""));
  }

  /* -------------------------------------------------------- constructeur */
  const DIST = {

  function mapImage(grid, mode, thr) {
    const G = grid.length, cv = document.createElement("canvas");
    cv.width = G; cv.height = G;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(G, G);
    const c0 = cssColor("--c1"), c1 = cssColor("--c2"), bg = cssColor("--paper");
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const p = grid[j][i], k = ((G - 1 - j) * G + i) * 4;
      const c = mode === "class" ? (p >= thr ? c1 : c0) : p >= 0.5 ? c1 : c0;
      const a = mode === "class" ? 0.3 : Math.min(1, Math.abs(p - 0.5) * 2) * 0.62;
      for (let q = 0; q < 3; q++) img.data[k + q] = Math.round(bg[q] + (c[q] - bg[q]) * a);

    for (let j = 0; j < G - 1; j++) for (let i = 0; i < G - 1; i++) {

        '<div class="cols2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="stack"><div class="chart" id="ch-path"></div><div class="chart" id="ch-pathcv"></div></div><div class="stack"><div class="chart" id="ch-coef"></div><div id="path-read"></div></div></div>');
    renderLabCtl();
    labUpdate(); vcUpdate(); cvRender(true); gsRender(); pathRender(true);
  }

  /* ------------------------------------------------------------- contrôles */
  function renderLabCtl() {
    const opt = (id, cur, opts) => '<select id="' + id + '" class="sel" style="width:100%">' + opts.map((o) => '<option value="' + o[0] + '"' + (o[0] === cur ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>";
    $("#lab-ctl").innerHTML =
      '<div class="ctl"><h3>Données</h3>' +
      '<div class="field"><label for="lab-shape">Forme des classes</label>' + opt("lab-shape", lab.shape, Object.keys(ENG.SHAPES).map((k) => [k, ENG.SHAPES[k].label])) + "</div>" +
      rangeCtl("lab-n", "Nombre de points", { min: 40, max: 400, step: 10, value: lab.n, out: lab.n }) +
      rangeCtl("lab-noise", "Bruit (chevauchement)", { min: 0, max: 0.25, step: 0.005, value: lab.noise, out: N(lab.noise, 3) }) +
      rangeCtl("lab-pos", "Part de positifs (classe 1)", { min: 0.03, max: 0.5, step: 0.01, value: lab.pos, out: Math.round(lab.pos * 100) + " %" }) +
      '<div class="field"><span class="lab">Part de test (stratifiée)</span>' + seg("testFrac", lab.testFrac, [[0.2, "20 %"], [0.3, "30 %"], [0.4, "40 %"]]) + "</div>" +
      '<button type="button" class="btn" id="lab-seed">' + ICON.dice + "<span>Nouveau tirage</span></button></div>" +
      '<div class="ctl"><h3>Modèle</h3>' + opt("lab-model", lab.model, Object.keys(LABM).map((k) => [k, LABM[k].label])) +
      '<div id="lab-params" style="display:grid;gap:10px"></div>' +
      (LABM[lab.model].fiche ? '<button type="button" class="btn" data-goto-fiche="' + LABM[lab.model].fiche + '">' + ICON.book + "<span>Voir la fiche du modèle</span></button>" : "") + "</div>" +
      '<div class="ctl"><h3>Affichage</h3>' +
      '<div class="field"><span class="lab">Fond</span>' + seg("mapmode", lab.show.map, [["proba", "probabilités"], ["class", "classes au seuil"]]) + "</div>" +
      rangeCtl("thr", "Seuil de décision", { min: 0.01, max: 0.99, step: 0.01, value: lab.thr, out: N(lab.thr, 2) }) +
      '<div class="toggles">' + chk("sh-test", "Points de test", lab.show.test, swatch("var(--ink)", "ring")) + chk("sh-boundary", "Frontière au seuil", lab.show.boundary, swatch("var(--c-fit)", "line")) + "</div></div>";
    renderParamCtl();
  }
  function renderParamCtl() {
    const p = P();
    $("#lab-params").innerHTML = LABM[lab.model].ctl.map((c) => {
      if (c === "weights") return '<div class="field"><span class="lab">weights</span>' + seg("knnw", p.weights, [["uniform", "uniform"], ["distance", "distance"]]) + "</div>";
      if (c === "pen") return '<div class="field"><span class="lab">Pénalité (l1_ratio)</span>' + seg("pen", String(p.l1), [["0", "L2 (0)"], ["1", "L1 (1)"]]) + "</div>";
      if (c === "cw") return '<div class="field"><span class="lab">class_weight</span>' + seg("cw", p.cw, [["none", "None"], ["balanced", "balanced"]]) + "</div>";
      if (c === "crit") return '<div class="field"><span class="lab">criterion</span>' + seg("crit", p.crit, [["gini", "gini"], ["entropy", "entropy"]]) + "</div>";
      if (c === "mf") return '<div class="field"><span class="lab">max_features (sur 2 variables)</span>' + seg("mf", String(p.mf), [["1", "1 = sqrt"], ["2", "2 = toutes"]]) + "</div>";
      const C = CTL[c], v = p[C.key];
      return rangeCtl("pc-" + c, C.label, { min: C.min, max: C.max, step: C.step || (C.log ? 0.05 : 1), value: C.log ? Math.log10(v) : v, out: ctlVal(c, v), hint: C.hint, data: 'data-pc="' + c + '"' });
    }).join("");
  }

  /* ---------------------------------------------------------- banc d'essai */
  function labUpdate() {
    FIT = ENG.fit(lab.model, D.train.X, D.train.y, P());
    const f = FIT, G = lab.model === "knn" || lab.model === "tree" || lab.model === "rf" ? 110 : 80;
    const grid = probGrid(f, G);
    const Pl = VIZ.Plot({ w: 640, h: 560, x: DOM, y: DOM, xlabel: "x₁", ylabel: "x₂", m: { t: 16, r: 14, b: 34, l: 40 } });
    Pl.add('<image href="' + mapImage(grid, lab.show.map, lab.thr) + '" x="' + Pl.x(DOM[0]) + '" y="' + Pl.y(DOM[1]) + '" width="' + (Pl.x(DOM[1]) - Pl.x(DOM[0])) + '" height="' + (Pl.y(DOM[0]) - Pl.y(DOM[1])) + '" preserveAspectRatio="none" style="image-rendering:auto"/>');
    Pl.grid(6, 6);
    if (lab.show.boundary) {
      const segs = contour(grid, lab.thr);
      Pl.add('<path d="' + segs.map((s) => "M" + Pl.x(s[0][0]).toFixed(1) + " " + Pl.y(s[0][1]).toFixed(1) + "L" + Pl.x(s[1][0]).toFixed(1) + " " + Pl.y(s[1][1]).toFixed(1)).join("") + '" style="stroke:var(--c-fit);stroke-width:2.2;fill:none;stroke-linecap:round"/>');
    }
    const col = (c) => (c ? "var(--c2)" : "var(--c1)"), inDom = (x) => x[0] >= DOM[0] && x[0] <= DOM[1] && x[1] >= DOM[0] && x[1] <= DOM[1];
    D.train.X.forEach((x, i) => inDom(x) && Pl.dot(x[0], x[1], 4, "fill:" + col(D.train.y[i]) + ";stroke:var(--paper);stroke-width:1.2"));
    if (lab.show.test) D.test.X.forEach((x, i) => {
      if (!inDom(x)) return;
      const wrong = (f(x) >= lab.thr ? 1 : 0) !== D.test.y[i];
      Pl.dot(x[0], x[1], 4.6, "fill:var(--paper);stroke:" + col(D.test.y[i]) + ";stroke-width:2.2");
      if (wrong) Pl.dot(x[0], x[1], 8, "fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 2");
    });
    const el = $("#ch-map");
    el.innerHTML = Pl.svg("Carte des probabilités du modèle " + LABM[lab.model].label + " et frontière de décision");
    const pts = [];
    D.train.X.forEach((x, i) => pts.push({ px: Pl.x(x[0]), py: Pl.y(x[1]), x, c: D.train.y[i], k: "Entraînement" }));
    if (lab.show.test) D.test.X.forEach((x, i) => pts.push({ px: Pl.x(x[0]), py: Pl.y(x[1]), x, c: D.test.y[i], k: "Test" }));
    VIZ.hover(el, Pl, (pt) => {
      const o = VIZ.nearest(pts, pt, 12);
      if (o) { const p = f(o.x); return { html: VIZ.sw(col(o.c)) + "<b>" + o.k + " · classe " + o.c + "</b><br>p̂(classe 1) = " + N(p, 3) + "<br>prédit : " + (p >= lab.thr ? 1 : 0) + (((p >= lab.thr) ? 1 : 0) === o.c ? " ✓" : " ✗ erreur"), marks: '<circle cx="' + o.px + '" cy="' + o.py + '" r="9" style="fill:none;stroke:var(--ink);stroke-width:1.5"/>' }; }
      const x = [Pl.x.inv(pt.x), Pl.y.inv(pt.y)];
      return { html: "x₁ = " + N(x[0], 2) + " · x₂ = " + N(x[1], 2) + "<br>p̂(classe 1) = <b>" + N(f(x), 3) + "</b>" };
    });
    $("#map-legend").innerHTML = "<span>" + swatch("var(--c1)") + "classe 0 (" + D.train.y.filter((v) => !v).length + " train)</span><span>" + swatch("var(--c2)") + "classe 1 (" + D.train.y.filter((v) => v).length + " train)</span>" + (lab.show.test ? "<span>" + swatch("var(--ink)", "ring") + "test (" + D.test.y.length + ") · pointillés = erreur</span>" : "") + (lab.show.boundary ? "<span>" + swatch("var(--c-fit)", "line") + "frontière p̂ = " + N(lab.thr, 2) + "</span>" : "") + "<span>fond : " + (lab.show.map === "proba" ? "intensité = certitude du modèle" : "classe prédite au seuil") + "</span>";
    // métriques
    const Ptr = D.train.X.map((x) => f(x)), Pte = D.test.X.map((x) => f(x));
    const cTe = ENG.confusion(Pte, D.test.y, lab.thr), cTr = ENG.confusion(Ptr, D.train.y, lab.thr);
    const llTr = ENG.logloss(Ptr, D.train.y), llTe = ENG.logloss(Pte, D.test.y), aucTr = ENG.rocAuc(Ptr, D.train.y), aucTe = ENG.rocAuc(Pte, D.test.y), apTe = ENG.avgPrec(Pte, D.test.y);
    $("#lab-metrics").innerHTML =
      '<div class="metric"><span>PR-AUC test</span><b>' + N(apTe, 3) + "</b><small>base (prévalence) : " + N(D.test.y.filter((v) => v).length / D.test.y.length, 2) + "</small></div>" +
      '<div class="metric"><span>ROC-AUC test</span><b>' + N(aucTe, 3) + "</b><small>train : " + N(aucTr, 3) + "</small></div>" +
      '<div class="metric"><span>Log-loss test</span><b>' + N(llTe, 3) + "</b><small>train : " + N(llTr, 3) + "</small></div>" +
      '<div class="metric"><span>Accuracy test</span><b>' + N(cTe.acc, 3) + "</b><small>F1 = " + N(cTe.f1, 3) + " · train acc " + N(cTr.acc, 2) + "</small></div>";
    $("#lab-cm").innerHTML = cmHtml(cTe, "test");
    let b;
    if (llTe - llTr > 0.12 || aucTr - aucTe > 0.04) b = ["bad", ICON.warn, "Surapprentissage", "Le modèle est bien plus sûr de lui sur le train (log-loss " + N(llTr, 2) + ") que sur le test (" + N(llTe, 2) + ")."];
    else if (aucTe < 0.85 && Math.abs(aucTr - aucTe) < 0.04 && llTr > 0.35) b = ["warn", ICON.info, "Sous-apprentissage probable", "Train et test sont aussi mauvais l'un que l'autre : modèle trop simple ou trop régularisé (ou classes très mêlées)."];
    else b = ["ok", ICON.check, "Bon compromis", "Scores de train et de test proches et corrects."];
    $("#lab-diag").innerHTML = '<span class="badge badge--' + b[0] + '">' + b[1] + b[2] + "</span><span>" + b[3] + (cTe.tp + cTe.fn ? " Rappel des positifs au seuil " + N(lab.thr, 2) + " : " + N(cTe.rec * 100, 0) + " %." : "") + "</span>";
    thrUpdate();
  }
  function cmHtml(c, which) {
    return "<span></span><span>prédit 0</span><span>prédit 1</span>" +
      '<span>réel 0</span><b class="ok">' + c.tn + '<small>vrais négatifs</small></b><b class="ko">' + c.fp + "<small>faux positifs</small></b>" +
      '<span>réel 1</span><b class="ko">' + c.fn + '<small>faux négatifs</small></b><b class="ok">' + c.tp + "<small>vrais positifs</small></b>" +
      '<span></span><span style="grid-column:2/4;font-weight:400;text-transform:none;letter-spacing:0">Matrice de confusion (' + which + ") · précision " + N(c.prec, 2) + " · rappel " + N(c.rec, 2) + "</span>";
  }

  /* ---------------------------------------------------- seuil et courbes */
  function thrUpdate() {
    if (!$("#ch-hist") || !FIT) return;
    const Pte = D.test.X.map((x) => FIT(x)), y = D.test.y, t = lab.thr, cv = ENG.curves(Pte, y);
    // histogrammes des probabilités par classe
    const bins = 20, h0 = new Array(bins).fill(0), h1 = new Array(bins).fill(0);
    Pte.forEach((p, i) => { const b = Math.min(bins - 1, Math.floor(p * bins)); (y[i] ? h1 : h0)[b]++; });
    const mx = Math.max(1, ...h0, ...h1);
    const Ph = VIZ.Plot({ w: 560, h: 230, x: [0, 1], y: [0, mx * 1.1], xlabel: "probabilité prédite p̂ (test)", ylabel: "nombre", m: { t: 16, r: 14, b: 34, l: 40 } });
    Ph.grid(5, 4);
    for (let b = 0; b < bins; b++) {
      if (h0[b]) Ph.rect(b / bins + 0.003, 0, (b + 0.5) / bins, h0[b], "fill:var(--c1);rx:2");
      if (h1[b]) Ph.rect((b + 0.5) / bins, 0, (b + 1) / bins - 0.003, h1[b], "fill:var(--c2);rx:2");
    }
    Ph.vline(t, "stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3", "seuil " + N(t, 2));
    Ph.text(t + 0.02, mx * 0.82, "prédit 1 →", "t-halo t-ink2", "start").text(t - 0.02, mx * 0.82, "← prédit 0", "t-halo t-ink2", "end");
    $("#ch-hist").innerHTML = Ph.svg("Distribution des probabilités prédites pour chaque classe, avec le seuil");
    // métriques en fonction du seuil
    const ts = ENG.range(99).map((i) => (i + 1) / 100), rows = ts.map((u) => { const c = ENG.confusion(Pte, y, u); return [u, c.prec, c.rec, c.f1]; });
    const Pm = VIZ.Plot({ w: 560, h: 230, x: [0, 1], y: [0, 1.02], xlabel: "seuil", ylabel: "score", m: { t: 16, r: 14, b: 34, l: 40 } });
    Pm.grid(5, 4).path(rows.map((r) => [r[0], r[1]]), "stroke:var(--c7);stroke-width:2.2").path(rows.map((r) => [r[0], r[2]]), "stroke:var(--c3);stroke-width:2.2").path(rows.map((r) => [r[0], r[3]]), "stroke:var(--c-fit);stroke-width:2.4");
    Pm.vline(t, "stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 3");
    const bestF = rows.reduce((a, r) => (r[3] > a[3] ? r : a), rows[0]);
    Pm.dot(bestF[0], bestF[3], 6, "fill:var(--paper);stroke:var(--c-fit);stroke-width:2").text(bestF[0], bestF[3], "F1 max", "t-halo t-ink2 t-b", "middle", -10);
    Pm.text(0.02, 0.08, "— précision (violet) · rappel (vert) · F1 (noir)", "t-halo t-ink2", "start");
    const el = $("#ch-tm");
    el.innerHTML = Pm.svg("Précision, rappel et F1 en fonction du seuil");
    VIZ.hover(el, Pm, (pt) => { const u = Math.round(VIZ.scale(0, 1, Pm.m.l, Pm.W - Pm.m.r).inv(pt.x) * 100) / 100; if (u <= 0 || u >= 1) return null; const c = ENG.confusion(Pte, y, u); return { html: "<b>seuil " + N(u, 2) + "</b><br>" + VIZ.sw("var(--c7)") + "précision " + N(c.prec, 2) + "<br>" + VIZ.sw("var(--c3)") + "rappel " + N(c.rec, 2) + "<br>" + VIZ.sw("var(--c-fit)") + "F1 " + N(c.f1, 2), marks: '<line x1="' + pt.x + '" x2="' + pt.x + '" y1="' + Pm.m.t + '" y2="' + (Pm.H - Pm.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' }; });
    // ROC
    const c = ENG.confusion(Pte, y, t);
    const Pr = VIZ.Plot({ w: 520, h: 260, x: [0, 1], y: [0, 1.02], xlabel: "taux de faux positifs (1 − spécificité)", ylabel: "rappel", m: { t: 18, r: 14, b: 34, l: 40 } });
    Pr.grid(5, 5).seg(0, 0, 1, 1, "stroke:var(--muted);stroke-dasharray:5 4");
    Pr.area(cv.roc.map((r) => [r[0], r[1], 0]), "fill:var(--accent);fill-opacity:.12").path(cv.roc.map((r) => [r[0], r[1]]), "stroke:var(--accent);stroke-width:2.4");
    Pr.dot(c.fp / Math.max(1, c.fp + c.tn), c.rec || 0, 6.5, "fill:var(--c2);stroke:var(--paper);stroke-width:2");
    Pr.text(0.55, 0.12, "ROC-AUC = " + N(ENG.rocAuc(Pte, y), 3), "t-halo t-ink t-b", "start");
    $("#ch-roc").innerHTML = Pr.svg("Courbe ROC sur le test, point au seuil courant");
    // PR
    const prev = cv.prevalence;
    const Pp = VIZ.Plot({ w: 520, h: 260, x: [0, 1], y: [0, 1.02], xlabel: "rappel", ylabel: "précision", m: { t: 18, r: 14, b: 34, l: 40 } });
    Pp.grid(5, 5).hline(prev, "stroke:var(--muted);stroke-dasharray:5 4", "hasard = prévalence " + N(prev, 2));
    const prPts = [[0, cv.pr.length ? cv.pr[0][1] : 1]].concat(cv.pr.map((r) => [r[0], r[1]]));
    Pp.path(prPts, "stroke:var(--accent);stroke-width:2.4");
    if (isFinite(c.prec)) Pp.dot(c.rec, c.prec, 6.5, "fill:var(--c2);stroke:var(--paper);stroke-width:2");
    Pp.text(0.04, 0.12, "PR-AUC (AP) = " + N(cv.ap, 3), "t-halo t-ink t-b", "start");
    $("#ch-pr").innerHTML = Pp.svg("Courbe précision-rappel sur le test, point au seuil courant");
  }

  /* -------------------------------------------- courbe de validation */
  const sweepOpts = () => LABM[lab.model].ctl.filter((c) => CTL[c]);
  const vcUpdate = debounce(() => {
    if (!$("#ch-vc")) return;
    const c = lab.sweep && sweepOpts().includes(lab.sweep) ? lab.sweep : LABM[lab.model].sweep;
    lab.sweep = c;
    const met = lab.metric, C = CTL[c], base = P();
    $("#vc-opts").innerHTML = '<div class="field"><span class="lab">Hyperparamètre balayé</span>' + seg("sweep", c, sweepOpts().map((s) => [s, CTL[s].key])) + "</div>" +
      '<div class="field"><span class="lab">Métrique</span>' + seg("metric", met, [["ap", "PR-AUC"], ["auc", "ROC-AUC"], ["logloss", "Log-loss"], ["f1", "F1"]]) + "</div>";
    const X = D.train.X, y = D.train.y, fl = ENG.folds("strat", y, 5, lab.seed);
    let rows;
    if (c === "rounds") {
      const pick = [1, 2, 3, 5, 8, 12, 18, 25, 35, 50, 70, 100, 140, 200, 280, 400], keep = new Set(pick);
      const per = fl.map((F) => ENG.fitBoost(F.train.map((i) => X[i]), F.train.map((i) => y[i]), Object.assign({}, base, { rounds: 400 }), [{ X: F.val.map((i) => X[i]), y: F.val.map((i) => y[i]), keep }, { X: F.train.map((i) => X[i]), y: F.train.map((i) => y[i]), keep }]).staged.map((s) => s.snap));
      rows = pick.map((r) => {
        const sv = fl.map((F, k) => ENG.score(met, per[k][0][r], F.val.map((i) => y[i]))), st = fl.map((F, k) => ENG.score(met, per[k][1][r], F.train.map((i) => y[i])));
        const ok = sv.filter(isFinite);
        return { v: r, cv: ENG.mean(ok), sd: ENG.std(ok), tr: ENG.mean(st.filter(isFinite)) };
      });
    } else {
      rows = C.sweep.map((v) => { const r = ENG.cv(lab.model, X, y, Object.assign({}, base, { [C.key]: v }), fl, met); return { v, cv: r.mean, sd: r.std, tr: r.train }; });
    }
    const log = c === "rounds" || C.log, lower = ENG.LOWER_BETTER[met];
    const vals = rows.flatMap((r) => [r.cv + r.sd, r.cv - r.sd, r.tr]).filter(isFinite);
    let yd = VIZ.extent(vals, 0.08);
    if (!lower) yd = [Math.max(0, yd[0]), Math.min(1.02, yd[1])]; else yd = [0, Math.min(yd[1], 3)];
    const Pl = VIZ.Plot({ w: 900, h: 320, x: [rows[0].v, rows[rows.length - 1].v], xlog: log, y: yd, xlabel: C.key + (log ? " (log)" : ""), ylabel: METRIC_LABEL[met] + (lower ? " (plus bas = mieux)" : " (plus haut = mieux)"), xfmt: C.log ? VIZ.fmtAlpha : VIZ.num, m: { t: 18, r: 16, b: 36, l: 48 } });
    Pl.grid(8, 5);
    Pl.area(rows.map((r) => [r.v, Math.min(yd[1], r.cv + r.sd), Math.max(yd[0], r.cv - r.sd)]), "fill:var(--c2);fill-opacity:.14");
    Pl.path(rows.map((r) => [r.v, r.tr]), "stroke:var(--c1);stroke-width:2.2").path(rows.map((r) => [r.v, r.cv]), "stroke:var(--c2);stroke-width:2.6");
    rows.forEach((r) => { Pl.dot(r.v, r.tr, 3, "fill:var(--c1)"); Pl.dot(r.v, r.cv, 3.4, "fill:var(--c2)"); });
    const best = rows.reduce((a, r) => (better(met, r.cv, a.cv) ? r : a), rows[0]);
    Pl.dot(best.v, best.cv, 8, "fill:none;stroke:var(--c2);stroke-width:2.2");
    const cur = base[C.key];
    if (cur >= rows[0].v && cur <= rows[rows.length - 1].v) Pl.vline(cur, "stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3", "actuel");
    const el = $("#ch-vc");
    el.innerHTML = Pl.svg("Courbe de validation selon " + C.key);
    el.classList.add("chart--click");
    const near = (pt) => rows.reduce((a, r) => (Math.abs(Pl.x(r.v) - pt.x) < Math.abs(Pl.x(a.v) - pt.x) ? r : a), rows[0]);
    VIZ.hover(el, Pl, (pt) => { const o = near(pt), px = Pl.x(o.v); return { html: "<b>" + C.key + " = " + ctlVal(c, o.v) + "</b><br>" + VIZ.sw("var(--c1)") + "train " + N(o.tr, 3) + "<br>" + VIZ.sw("var(--c2)") + "CV " + N(o.cv, 3) + " ± " + N(o.sd, 3) + '<br><span style="opacity:.75">Cliquer pour appliquer</span>', marks: '<line x1="' + px + '" x2="' + px + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' }; });
    el.querySelector("svg").addEventListener("click", (ev) => { const o = near(VIZ.svgPoint(el.querySelector("svg"), ev)); P()[C.key] = o.v; renderParamCtl(); onModelChange(); });
    $("#vc-read").innerHTML = fmt("Meilleure valeur en CV : **" + ctlVal(c, best.v) + "** (" + METRIC_LABEL[met] + " = " + N(best.cv, 3) + "). L'écart entre les deux courbes mesure le surapprentissage." + (met === "logloss" ? " La log-loss punit les probabilités trop confiantes : elle remonte souvent avant la PR-AUC." : ""));

      if (g.pos >= g.order.length) { g.timer = null; gsRender(); return; }
      const k = g.order[g.pos++], [ri, ci] = k.split(",").map(Number);
      g.cells[k] = gsCell(def, ri, ci); gsDraw(def);

  function gsReveal() {
