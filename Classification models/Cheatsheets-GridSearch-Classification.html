  /* ------------------------------------------------ chemins de régularisation */
  const PATH_CACHE = {};
  function pathData() {
    const pa = lab.path, key = pa.r + "|" + pa.seed;
    if (PATH_CACHE[key]) return PATH_CACHE[key];
    const Dd = ENG.pathData(pa.seed), Cs = ENG.logspace(-3, 2, 50);
    return (PATH_CACHE[key] = { Dd, Cs, coefs: ENG.pathAll(Dd, pa.r, Cs), cvr: ENG.pathCv(Dd, pa.r, Cs, 5) });
  }
  function pathRender(full) {
    if (!$("#ch-path")) return;
    const pa = lab.path;
    if (full) $("#path-opts").innerHTML = '<div class="field"><span class="lab">Pénalité</span>' + seg("pathr", String(pa.r), [["0", "L2 (l1_ratio = 0)"], ["1", "L1 (l1_ratio = 1)"]]) + "</div>" +
      '<div class="field" style="min-width:240px">' + rangeCtl("path-c", "C", { min: -3, max: 2, step: 0.02, value: Math.log10(pa.C), out: VIZ.fmtAlpha(pa.C) }) + "</div>" +
      '<button type="button" class="btn" id="path-seed">' + ICON.dice + "<span>Nouveau jeu</span></button>";
    const d = pathData(), Cs = d.Cs, p = d.Dd.p, yd = VIZ.extent(d.coefs.flat().concat([0]), 0.08);
    const Pl = VIZ.Plot({ w: 640, h: 320, x: [Cs[0], Cs[Cs.length - 1]], xlog: true, y: yd, xlabel: "C (log) — à gauche : forte pénalité", ylabel: "coefficient (variables standardisées)", xfmt: VIZ.fmtAlpha, m: { t: 18, r: 30, b: 36, l: 44 } });
    Pl.grid(6, 6).hline(0, "stroke:var(--ink-2);stroke-width:1");
    for (let j = 0; j < p; j++) Pl.path(Cs.map((c, i) => [c, d.coefs[i][j]]), "stroke:var(--c" + (j + 1) + ");stroke-width:" + (ENG.TRUE_COEF[j] ? 2.4 : 1.6) + (ENG.TRUE_COEF[j] ? "" : ";stroke-dasharray:5 3"));
    const lab0 = ENG.range(p).map((j) => ({ j, y: Pl.y(d.coefs[Cs.length - 1][j]) })).sort((u, v) => u.y - v.y);
    for (let i = 1; i < lab0.length; i++) if (lab0[i].y - lab0[i - 1].y < 12) lab0[i].y = lab0[i - 1].y + 12;
    lab0.forEach((o) => Pl.add('<text x="' + (Pl.W - Pl.m.r + 4) + '" y="' + (o.y + 4).toFixed(1) + '" class="t-b" style="fill:var(--c' + (o.j + 1) + ')">x' + (o.j + 1) + "</text>"));
    Pl.vline(pa.C, "stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3", "C = " + VIZ.fmtAlpha(pa.C));
    const el = $("#ch-path");
    el.innerHTML = Pl.svg("Coefficients des 8 variables en fonction de C");
    VIZ.hover(el, Pl, (pt) => {
      const cc = Pl.x.inv(pt.x); let i = 0, bd = Infinity;
      Cs.forEach((v, k) => { const dd = Math.abs(Math.log10(v) - Math.log10(cc)); if (dd < bd) { bd = dd; i = k; } });
      const px = Pl.x(Cs[i]);
      return { html: "<b>C = " + VIZ.fmtAlpha(Cs[i]) + "</b><br>" + ENG.range(p).map((j) => VIZ.sw("var(--c" + (j + 1) + ")") + "x" + (j + 1) + " : " + N(d.coefs[i][j], 2)).join("<br>"), marks: '<line x1="' + px + '" x2="' + px + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' };
    });
    const cvr = d.cvr, ib = cvr.reduce((b, r, i) => (r.mean < cvr[b].mean ? i : b), 0), thr = cvr[ib].mean + cvr[ib].se;
    let i1 = ib; for (let i = ib; i >= 0; i--) if (cvr[i].mean <= thr) i1 = i;
    const yc = VIZ.extent(cvr.map((r) => r.mean + r.se).concat(cvr.map((r) => r.mean - r.se)), 0.08);
    const Pc = VIZ.Plot({ w: 640, h: 200, x: [Cs[0], Cs[Cs.length - 1]], xlog: true, y: yc, xlabel: "C", ylabel: "log-loss de CV", xfmt: VIZ.fmtAlpha, m: { t: 18, r: 30, b: 34, l: 44 } });
    Pc.grid(6, 4).area(Cs.map((c, i) => [c, cvr[i].mean + cvr[i].se, cvr[i].mean - cvr[i].se]), "fill:var(--c2);fill-opacity:.15").path(Cs.map((c, i) => [c, cvr[i].mean]), "stroke:var(--c2);stroke-width:2.4");
    Pc.dot(Cs[ib], cvr[ib].mean, 6, "fill:var(--c2);stroke:var(--paper);stroke-width:2").dot(Cs[i1], cvr[i1].mean, 6, "fill:var(--paper);stroke:var(--c2);stroke-width:2.2");
    Pc.text(Cs[ib], cvr[ib].mean, "min", "t-halo t-ink2 t-b", "middle", -10).text(Cs[i1], cvr[i1].mean, "1 écart-type", "t-halo t-ink2", "middle", 18);
    Pc.vline(pa.C, "stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3");
    $("#ch-pathcv").innerHTML = Pc.svg("Log-loss de validation croisée en fonction de C");
    const cur = ENG.pathAll(d.Dd, pa.r, [pa.C])[0], lim = Math.max(2.4, ...cur.map(Math.abs)) * 1.05;
    const Pb = VIZ.Plot({ w: 380, h: 320, x: [-lim, lim], y: [p, 0], m: { t: 18, r: 14, b: 34, l: 40 }, yticks: [] });
    Pb.grid(4, 1).vline(0, "stroke:var(--ink-2);stroke-width:1");
    for (let j = 0; j < p; j++) {
      Pb.rect(Math.min(0, cur[j]), j + 0.2, Math.max(0, cur[j]), j + 0.8, "fill:var(--c" + (j + 1) + ");rx:3");
      Pb.dot(ENG.TRUE_COEF[j], j + 0.5, 4.5, "fill:var(--paper);stroke:var(--ink);stroke-width:2");
      Pb.add('<text x="' + (Pb.m.l - 8) + '" y="' + (Pb.y(j + 0.5) + 4) + '" text-anchor="end" class="t-ink2 t-b">x' + (j + 1) + "</text>");
    }
    Pb.add('<text x="' + Pb.m.l + '" y="12" class="t-ink2">coefficients à C = ' + VIZ.fmtAlpha(pa.C) + " · ○ vraie valeur</text>");
    $("#ch-coef").innerHTML = Pb.svg("Coefficients estimés au C courant comparés aux vraies valeurs");
    const nz = cur.filter((v) => Math.abs(v) > 1e-6).length;
    $("#path-read").innerHTML = '<div class="kpi-row"><span>Variables gardées</span><b>' + nz + " / " + p + "</b></div>" +
      '<p class="note">' + fmt("C minimisant la log-loss de CV : **" + VIZ.fmtAlpha(Cs[ib]) + "** ; règle du « 1 écart-type » (le plus régularisé, donc C le plus petit, dans l'incertitude du meilleur) : **" + VIZ.fmtAlpha(Cs[i1]) + "**.") + "</p>" +
      callout("info", pa.r ? "L1 : les variables inutiles (pointillés) sortent dès que C baisse. Entre x₁ et x₂, corrélées, le modèle peut en sacrifier une." : "L2 : aucun coefficient n'est exactement nul ; tous rétrécissent ensemble quand C baisse.");
  }

  function labClick(e) {
    const b = e.target.closest("button"); if (!b) return false;
    const sg = b.closest("[data-seg]");
    if (sg && b.dataset.val != null) {
      const n = sg.dataset.seg, v = b.dataset.val, p = P();
      if (n === "testFrac") { lab.testFrac = +v; onDataChange(); }
      else if (n === "knnw") { p.weights = v; onModelChange(true); }
      else if (n === "pen") { p.l1 = +v; onModelChange(); }
      else if (n === "cw") { p.cw = v; onModelChange(); }
      else if (n === "crit") { p.crit = v; onModelChange(); }
      else if (n === "mf") { p.mf = +v; onModelChange(); }
      else if (n === "mapmode") { lab.show.map = v; labUpdate(); }
      else if (n === "sweep") { lab.sweep = v; vcUpdate(); }
      else if (n === "metric" || n === "gsmetric") { lab.metric = v; vcUpdate(); cvRender(true); gsReset(); gsRender(); }
      else if (n === "cvscheme") { lab.cv.scheme = v; cvRender(true); }

      else if (n === "gsmode") { lab.gs.mode = v; gsReset(); gsRender(); }
      else if (n === "pathr") { lab.path.r = +v; pathRender(true); }
      else return false;
      $$("button", sg).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return true;
    }
    switch (b.id) {
      case "lab-seed": lab.seed = (lab.seed % 997) + 1; onDataChange(); return true;
      case "cv-play": cvPlay(); return true;
      case "cv-step": { const c = lab.cv; if (c.scores.length >= cvData().folds.length) { c.scores = []; c.cur = -1; } cvStep(); return true; }
      case "cv-all": { const c = lab.cv; clearInterval(c.timer); c.timer = null; c.scores = []; const K = cvData().folds.length; while (c.scores.length < K) cvStep(); cvRender(false); return true; }
      case "gs-run": gsRun(); return true;
      case "gs-reset": gsReset(); gsRender(); return true;
      case "gs-reveal": gsReveal(); return true;
      case "path-seed": lab.path.seed = (lab.path.seed % 97) + 1; pathRender(true); return true;
    }
    return false;
  }

  function foldMini(kind) {
    const n = 20, y = ENG.range(n).map((i) => (i % 4 === 0 ? 1 : 0)), W = 300, rh = 9, gap = 3;
    let fl, order = null;
    if (kind === "repeated") fl = ENG.folds("strat", y, 5, 1).concat(ENG.folds("strat", y, 5, 2));
    else if (kind === "loo") fl = ENG.range(8).map((i) => ({ val: [i], train: ENG.range(n).filter((j) => j !== i) }));
    else if (kind === "group") { const grp = ENG.range(n).map((i) => Math.floor(i / 4)); fl = ENG.range(5).map((g) => ({ val: ENG.range(n).filter((i) => grp[i] === g), train: ENG.range(n).filter((i) => grp[i] !== g) })); }
    else if (kind === "shuffle") { const r = ENG.rng(4); fl = ENG.range(5).map(() => { const pos = ENG.shuffle(ENG.range(n).filter((i) => y[i]), r).slice(0, 1), neg = ENG.shuffle(ENG.range(n).filter((i) => !y[i]), r).slice(0, 3), v = pos.concat(neg); return { val: v, train: ENG.range(n).filter((i) => !v.includes(i)) }; }); }
    else if (kind === "kfold-shuffle") fl = ENG.folds("kfold-shuffle", y, 5, 6);
    else if (kind === "time") fl = ENG.folds("time", y, 5, 2);
    else fl = ENG.folds("strat", y, 5, 2);
    const rows = Math.min(fl.length, 10), H = rows * (rh + gap) + 4, cw = W / n;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Schéma des folds">';
    fl.slice(0, rows).forEach((F, r) => {
      const role = new Array(n).fill(0);
      F.train.forEach((i) => (role[i] = 1)); F.val.forEach((i) => (role[i] = y[i] ? 3 : 2));
      role.forEach((ro, p) => {
        const col = ro === 3 ? "var(--c2)" : ro === 2 ? "var(--c1)" : ro === 1 ? "color-mix(in oklab, var(--ink) 22%, var(--paper))" : "var(--line-2)";
        s += '<rect x="' + (p * cw + 0.6).toFixed(1) + '" y="' + (2 + r * (rh + gap)) + '" width="' + (cw - 1.2).toFixed(1) + '" height="' + rh + '" rx="1.5" style="fill:' + col + '"/>';
      });
    });
    if (kind === "group") for (let g = 1; g < 5; g++) s += '<line x1="' + g * 4 * cw + '" x2="' + g * 4 * cw + '" y1="0" y2="' + H + '" style="stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2"/>';
    void order;
    return s + "</svg>";
  }

  /* ==========================================================================
     Simulation analytique : deux distributions de scores (négatifs ~ N(0, 1),
     positifs ~ N(d, 1)), une prévalence π et un seuil t, pour 1 000 individus.
     ========================================================================== */
  function erf(x) { const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a); return s * (1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a)); }
  const Phi = (x) => 0.5 * (1 + erf(x / Math.SQRT2));
  const phi = (x) => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
  function scoreModel(d, pi, t) {
    const N = 1000, tpr = 1 - Phi(t - d), fpr = 1 - Phi(t);
    const tp = N * pi * tpr, fn = N * pi - tp, fp = N * (1 - pi) * fpr, tn = N * (1 - pi) - fp;
    const prec = tp + fp > 1e-9 ? tp / (tp + fp) : NaN, rec = tpr, f1 = prec + rec > 0 ? (2 * prec * rec) / (prec + rec) : 0;
    let ap = 0, prevR = 1;
    for (let k = -60; k <= 80; k++) { const u = k / 10, R = 1 - Phi(u - d), F = 1 - Phi(u), Pr = R * pi + F * (1 - pi) > 0 ? (R * pi) / (R * pi + F * (1 - pi)) : 1; ap += (prevR - R) * Pr; prevR = R; }
    return { tp, fn, fp, tn, acc: (tp + tn) / N, bal: (tpr + 1 - fpr) / 2, prec, rec, f1, auc: Phi(d / Math.SQRT2), ap, tpr, fpr };
  }
  function scoreWidget(pfx, st) {
    const html = () =>
      '<div class="b-opts">' +
      '<div class="field" style="min-width:200px">' + rangeCtl(pfx + "-pi", "Part de positifs π", { min: 0.01, max: 0.5, step: 0.01, value: st.pi, out: Math.round(st.pi * 100) + " %" }) + "</div>" +
      '<div class="field" style="min-width:200px">' + rangeCtl(pfx + "-d", "Séparation des classes d", { min: 0, max: 4, step: 0.05, value: st.d, out: N(st.d, 2) }) + "</div>" +
      '<div class="field" style="min-width:200px">' + rangeCtl(pfx + "-t", "Seuil sur le score", { min: -2, max: 5, step: 0.05, value: st.t, out: N(st.t, 2) }) + "</div></div>" +
      '<div class="wgrid"><div class="stack"><div class="chart" id="' + pfx + '-dens"></div>' + (st.curves ? '<div class="cols2"><div class="chart" id="' + pfx + '-roc"></div><div class="chart" id="' + pfx + '-pr"></div></div>' : "") + "</div>" +
      '<div class="stack"><div class="cm" id="' + pfx + '-cm"></div><div class="dec" id="' + pfx + '-bars"></div><p class="note" id="' + pfx + '-read"></p></div></div>';
    const draw = () => {
      const r = scoreModel(st.d, st.pi, st.t), xs = ENG.range(241).map((i) => -4 + (i * (st.d + 8)) / 240);
      const y0 = (x) => (1 - st.pi) * phi(x), y1 = (x) => st.pi * phi(x - st.d), top = Math.max(...xs.map(y0), ...xs.map(y1)) * 1.12;
      const Pl = VIZ.Plot({ w: 620, h: 260, x: [xs[0], xs[xs.length - 1]], y: [0, top], xlabel: "score du modèle", ylabel: "densité (pondérée par la prévalence)", m: { t: 16, r: 14, b: 34, l: 40 }, yfmt: () => "" });
      Pl.grid(8, 4);
      Pl.area(xs.filter((x) => x >= st.t).map((x) => [x, y0(x), 0]), "fill:var(--c1);fill-opacity:.35");
      Pl.area(xs.filter((x) => x < st.t).map((x) => [x, y1(x), 0]), "fill:var(--c2);fill-opacity:.35");
      Pl.path(xs.map((x) => [x, y0(x)]), "stroke:var(--c1);stroke-width:2.4").path(xs.map((x) => [x, y1(x)]), "stroke:var(--c2);stroke-width:2.4");
      Pl.vline(st.t, "stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3", "seuil");
      Pl.text(st.t + 0.15, top * 0.55, "prédit positif →", "t-halo t-ink2", "start").text(st.t - 0.15, top * 0.55, "← prédit négatif", "t-halo t-ink2", "end");
      $("#" + pfx + "-dens").innerHTML = Pl.svg("Distribution des scores des négatifs (bleu) et des positifs (orange) ; zones hachurées : erreurs");
      $("#" + pfx + "-cm").innerHTML = cmHtml({ tn: Math.round(r.tn), fp: Math.round(r.fp), fn: Math.round(r.fn), tp: Math.round(r.tp), prec: r.prec, rec: r.rec }, "1 000 individus");
      const row = (l, v, c) => '<div class="dec__row"><span>' + l + '</span><div class="dec__bar"><i style="width:' + (isFinite(v) ? Math.max(0, v) * 100 : 0).toFixed(1) + "%;background:" + c + '"></i></div><b>' + N(v, 3) + "</b></div>";
      $("#" + pfx + "-bars").innerHTML = row("Accuracy", r.acc, "var(--muted)") + row("Balanced acc.", r.bal, "var(--c4)") + row("Précision", r.prec, "var(--c7)") + row("Rappel", r.rec, "var(--c3)") + row("F1", r.f1, "var(--c-fit)") + row("ROC-AUC", r.auc, "var(--c1)") + row("PR-AUC (AP)", r.ap, "var(--c2)");
      $("#" + pfx + "-read").innerHTML = fmt("Le modèle « toujours négatif » aurait une accuracy de **" + N(1 - st.pi, 3) + "** et un rappel de 0. ROC-AUC et PR-AUC ne dépendent pas du seuil ; la PR-AUC chute quand π baisse, la ROC-AUC non." + (r.acc < 1 - st.pi ? " Ici, le modèle a une accuracy **inférieure** au modèle trivial alors qu'il trouve " + Math.round(r.rec * 100) + " % des positifs." : ""));
      if (st.curves) {
        const us = ENG.range(141).map((i) => -6 + i / 10);
        const Pr = VIZ.Plot({ w: 320, h: 240, x: [0, 1], y: [0, 1.02], xlabel: "taux de faux positifs", ylabel: "rappel", m: { t: 16, r: 10, b: 34, l: 36 } });
        Pr.grid(4, 4).seg(0, 0, 1, 1, "stroke:var(--muted);stroke-dasharray:5 4").path(us.map((u) => [1 - Phi(u), 1 - Phi(u - st.d)]), "stroke:var(--accent);stroke-width:2.4").dot(r.fpr, r.tpr, 6, "fill:var(--c2);stroke:var(--paper);stroke-width:2");
        $("#" + pfx + "-roc").innerHTML = Pr.svg("Courbe ROC");
        const Pp = VIZ.Plot({ w: 320, h: 240, x: [0, 1], y: [0, 1.02], xlabel: "rappel", ylabel: "précision", m: { t: 16, r: 10, b: 34, l: 36 } });
        Pp.grid(4, 4).hline(st.pi, "stroke:var(--muted);stroke-dasharray:5 4");
        [0.5, 0.2, 0.05].forEach((q, k) => Pp.path(us.map((u) => { const R = 1 - Phi(u - st.d), F = 1 - Phi(u); return [R, (R * q) / (R * q + F * (1 - q))]; }), "stroke:var(--muted);stroke-width:1;stroke-opacity:" + (0.6 - k * 0.15)));
        Pp.path(us.map((u) => { const R = 1 - Phi(u - st.d), F = 1 - Phi(u); return [R, (R * st.pi) / (R * st.pi + F * (1 - st.pi))]; }), "stroke:var(--accent);stroke-width:2.4");
        if (isFinite(r.prec)) Pp.dot(r.rec, r.prec, 6, "fill:var(--c2);stroke:var(--paper);stroke-width:2");
        Pp.text(0.98, 0.95, "gris : π = 50 %, 20 %, 5 %", "t-halo", "end");
        $("#" + pfx + "-pr").innerHTML = Pp.svg("Courbe précision-rappel ; en gris, la même qualité de modèle pour d'autres prévalences");
      }
    };
    const input = (t) => {
      if (t.id === pfx + "-pi") { st.pi = +t.value; $("#" + t.id + "-o").textContent = Math.round(st.pi * 100) + " %"; }
      else if (t.id === pfx + "-d") { st.d = +t.value; $("#" + t.id + "-o").textContent = N(st.d, 2); }
      else if (t.id === pfx + "-t") { st.t = +t.value; $("#" + t.id + "-o").textContent = N(st.t, 2); }
      else return false;
      draw(); return true;
    };
    return { html, draw, input };
  }
  const MET_SIM = scoreWidget("ms", { pi: 0.05, d: 2, t: 1.5, curves: false });

  const MT = [
    { id: "m-sig", title: "Sigmoïde, probabilité et log-odds", icon: "curve",
      simple: [
        "La régression logistique calcule d'abord un **score** comme une régression linéaire : $z = w^\\top x + b$. Ce score peut valoir n'importe quoi, de −∞ à +∞.",
        "La **sigmoïde** l'écrase entre 0 et 1 pour en faire une probabilité : très négatif → presque 0, très positif → presque 1, z = 0 → 0,5.",
        "Lecture inverse : z est le **log-odds**, le logarithme du rapport « chances d'être positif / chances d'être négatif ». Un coefficient wⱼ = 0,7 multiplie ces chances par e^0,7 ≈ 2 quand xⱼ augmente de 1.",
      ],
      key: R`p = \sigma(z) = \frac{1}{1+e^{-z}},\qquad z = \log\frac{p}{1-p} = w^\top x + b`, keyTxt: "σ : sigmoïde ; z : score linéaire (logit) ; p : probabilité de la classe 1.",
      steps: [
        { p: "La sigmoïde est symétrique : $\\sigma(-z) = 1 - \\sigma(z)$, et sa dérivée s'exprime avec elle-même — ce qui rend les calculs de gradient très simples.", tex: R`\sigma'(z) = \sigma(z)\,\big(1-\sigma(z)\big)` },
        { p: "Rapport de chances : passer de $x_j$ à $x_j + 1$ ajoute $w_j$ au logit, donc multiplie les chances par $e^{w_j}$ (odds ratio).", tex: R`\frac{p/(1-p)\ \text{après}}{p/(1-p)\ \text{avant}} = e^{w_j}` },
        { p: "Au seuil 0,5, on prédit 1 quand z > 0 : la frontière $w^\\top x + b = 0$ est une droite (un hyperplan). Un autre seuil t déplace la frontière parallèlement : $w^\\top x + b = \\log\\frac{t}{1-t}$." },
      ],
      widgets: ["sig"] },
    { id: "m-ll", title: "Log-loss et maximum de vraisemblance", icon: "target",

  /* ------------------------------------------------------------ widgets */
  const W = {};
  const wrap = (title, pill, body) => '<div class="widget"><div class="widget__head">' + ICON.flask + "<h4>" + title + "</h4>" + (pill ? '<span class="pill">' + pill + "</span>" : "") + "</div>" + body + "</div>";
  const SIGD = (() => {
    const r = ENG.rng(19), x = [], y = [];
    for (let i = 0; i < 40; i++) { const xi = -3 + 6 * r(); x.push(xi); y.push(r() < ENG.sigmoid(1.6 * xi - 0.4) ? 1 : 0); }
    // optimum (Newton, sans pénalité, petit ridge pour la stabilité)
    let w = 0, b = 0;
    for (let it = 0; it < 50; it++) {
      let gw = 0.01 * w, gb = 0, hww = 0.01, hwb = 0, hbb = 1e-6;
      x.forEach((xi, i) => { const p = ENG.sigmoid(w * xi + b), e = p - y[i], h = p * (1 - p); gw += e * xi; gb += e; hww += h * xi * xi; hwb += h * xi; hbb += h; });
      const det = hww * hbb - hwb * hwb; w -= (hbb * gw - hwb * gb) / det; b -= (hww * gb - hwb * gw) / det;
    }
    return { x, y, w, b };
  })();
  const llOf = (w, b) => ENG.mean(SIGD.x.map((xi, i) => { const p = ENG.clamp(ENG.sigmoid(w * xi + b), 1e-12, 1 - 1e-12); return SIGD.y[i] ? -Math.log(p) : -Math.log(1 - p); }));

  W.sig = {
    st: { w: 0.6, b: 0.8 },
    html() {
      const s = this.st;

        rangeCtl("sig-w", "Pente w", { min: -1, max: 4, step: 0.05, value: s.w, out: N(s.w, 2) }) + rangeCtl("sig-b", "Biais b", { min: -3, max: 3, step: 0.05, value: s.b, out: N(s.b, 2) }) +

    },
    draw() {
      const s = this.st, f = (x) => ENG.sigmoid(s.w * x + s.b);
      const Pl = VIZ.Plot({ w: 560, h: 300, x: [-3.2, 3.2], y: [-0.1, 1.1], xlabel: "x", ylabel: "p = σ(wx + b)", m: { t: 14, r: 14, b: 32, l: 40 } });
      Pl.grid(6, 5).hline(0.5, "stroke:var(--muted);stroke-dasharray:5 4");
      SIGD.x.forEach((x, i) => { const p = f(x); Pl.seg(x, SIGD.y[i], x, p, "stroke:var(--c-err);stroke-opacity:.4;stroke-width:1.2"); });

      if (s.w) Pl.vline(-s.b / s.w, "stroke:var(--ink);stroke-width:1.4;stroke-dasharray:3 3", "frontière x = −b/w");
      $("#w-sig").innerHTML = Pl.svg("Données binaires et sigmoïde ajustée");
      const ll = llOf(s.w, s.b), ll0 = llOf(SIGD.w, SIGD.b);
      $("#sig-read").innerHTML = "<span>Log-loss moyenne : <b>" + N(ll, 3) + "</b></span><span>Minimum : <b>" + N(ll0, 3) + "</b> (w = " + N(SIGD.w, 2) + ", b = " + N(SIGD.b, 2) + ")</span><span>Odds ratio e^w : <b>" + N(Math.exp(s.w), 2) + "</b></span>" + (ll - ll0 < 0.002 ? '<span class="badge badge--ok">' + ICON.check + "Vraisemblance maximale</span>" : "");
    },
    init() { this.draw(); },
    input(t) { const s = this.st; if (t.id === "sig-w") { s.w = +t.value; $("#sig-w-o").textContent = N(s.w, 2); } else if (t.id === "sig-b") { s.b = +t.value; $("#sig-b-o").textContent = N(s.b, 2); } else return false; this.draw(); return true; },
    click(b) {
      if (b.id !== "sig-fit") return false;
      const s = this.st, w0 = s.w, b0 = s.b, t0 = performance.now();
      const step = (now) => { const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); s.w = w0 + (SIGD.w - w0) * e; s.b = b0 + (SIGD.b - b0) * e; $("#sig-w").value = s.w; $("#sig-b").value = s.b; $("#sig-w-o").textContent = N(s.w, 2); $("#sig-b-o").textContent = N(s.b, 2); this.draw(); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step); return true;
    },
  };
  W.ll = {
    html() {
      return wrap("Le coût d'une prédiction selon la probabilité annoncée", "interactif",

        '<p class="note">Annoncer p = 0,01 pour un positif coûte 4,6 en log-loss, mais seulement 0,98 en erreur quadratique : la log-loss punit beaucoup plus les erreurs confiantes. Survolez le graphique.</p></div></div>');
    },
    draw() {

      const el = $("#w-ll");
      el.innerHTML = Pl.svg("Log-loss et erreur quadratique en fonction de la probabilité annoncée");
      VIZ.hover(el, Pl, (pt) => { const p = Pl.x.inv(pt.x); if (p <= 0 || p >= 1) return null; return { html: "<b>p = " + N(p, 2) + "</b><br>" + VIZ.sw("var(--c2)") + "si y = 1 : " + N(-Math.log(p), 2) + "<br>" + VIZ.sw("var(--c1)") + "si y = 0 : " + N(-Math.log(1 - p), 2), marks: '<line x1="' + pt.x + '" x2="' + pt.x + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' }; });
    },
    init() { this.draw(); },
  };

  // Géométrie des contraintes (identique au cas linéaire : les lignes de niveau sont approximativement des ellipses)
  function boundaryPts(kind, t, r, n) {
    const pts = [], norm = (a, b) => (kind === "l1" ? Math.abs(a) + Math.abs(b) : kind === "l2" ? Math.hypot(a, b) : r * (Math.abs(a) + Math.abs(b)) + (1 - r) * Math.hypot(a, b));
    for (let i = 0; i <= n; i++) { const ph = (2 * Math.PI * i) / n, u = Math.cos(ph), v = Math.sin(ph); pts.push([(t * u) / norm(u, v), (t * v) / norm(u, v)]); }
    return pts;
  }
  W.geo = {
    st: { kind: "l1", t: 1.2, rho: 0.35, b: [2.1, 0.9], r: 0.5 },
    html() {

      return wrap("Pourquoi L1 produit des zéros : la géométrie", "glisser le point",
        '<div class="b-opts"><div class="field"><span class="lab">Pénalité</span>' + seg("geokind", s.kind, [["l2", "L2 (l1_ratio = 0)"], ["l1", "L1 (l1_ratio = 1)"], ["en", "Elastic Net"]]) + "</div>" +
        '<div class="field" style="min-width:200px">' + rangeCtl("geo-t", "Budget t (grand C = grand budget)", { min: 0.2, max: 2.6, step: 0.02, value: s.t, out: N(s.t, 2) }) + "</div>" +
        '<div class="field" style="min-width:200px">' + rangeCtl("geo-rho", "Corrélation des variables", { min: -0.85, max: 0.85, step: 0.05, value: s.rho, out: N(s.rho, 2) }) + "</div></div>" +
        '<div class="wgrid"><div class="chart" id="w-geo" style="touch-action:none"></div><div class="stack"><div class="readout" id="geo-read"></div><p class="note">Faites glisser ŵ (sans pénalité). Les ellipses approchent les lignes de niveau de la log-loss autour de son minimum ; la solution pénalisée est le premier point de la région colorée qu\'elles touchent.</p></div></div>');
    },
    solve() {
      const s = this.st, A = [[1, s.rho], [s.rho, 1]];
      const Q = (p) => { const d0 = p[0] - s.b[0], d1 = p[1] - s.b[1]; return A[0][0] * d0 * d0 + 2 * A[0][1] * d0 * d1 + A[1][1] * d1 * d1; };
      const norm = (a, b) => (s.kind === "l1" ? Math.abs(a) + Math.abs(b) : s.kind === "l2" ? Math.hypot(a, b) : s.r * (Math.abs(a) + Math.abs(b)) + (1 - s.r) * Math.hypot(a, b));
      if (norm(s.b[0], s.b[1]) <= s.t) return { p: s.b.slice(), Q, inside: true };
      let best = null, bq = Infinity;
      boundaryPts(s.kind, s.t, s.r, 1440).forEach((p) => { const q = Q(p); if (q < bq) { bq = q; best = p; } });

    },
    draw() {
      const s = this.st, Pl = VIZ.Plot({ w: 520, h: 440, x: [-3, 3], y: [-2.6, 2.6], xlabel: "w₁", ylabel: "w₂", m: { t: 14, r: 14, b: 34, l: 38 } });
      Pl.grid(6, 6).hline(0, "stroke:var(--ink-2)").vline(0, "stroke:var(--ink-2)");
      const sol = this.solve(), lam = [1 + s.rho, 1 - s.rho], e1 = [Math.SQRT1_2, Math.SQRT1_2], e2 = [-Math.SQRT1_2, Math.SQRT1_2];
      const reg = boundaryPts(s.kind, s.t, s.r, 360);
      Pl.add('<path d="M' + reg.map((p) => Pl.x(p[0]).toFixed(1) + " " + Pl.y(p[1]).toFixed(1)).join("L") + 'Z" style="fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2"/>');
      const c0 = sol.Q(sol.p);
      [c0 * 0.25, c0 * 0.6, c0, c0 * 1.7, c0 * 2.8].filter((c) => c > 1e-6).forEach((c, k) => {
        Pl.path(ENG.range(181).map((i) => { const ph = (2 * Math.PI * i) / 180, a = Math.sqrt(c / lam[0]) * Math.cos(ph), b = Math.sqrt(c / lam[1]) * Math.sin(ph); return [s.b[0] + a * e1[0] + b * e2[0], s.b[1] + a * e1[1] + b * e2[1]]; }), "stroke:var(--c2);stroke-width:" + (k === 2 ? 2.2 : 1.1) + ";stroke-opacity:" + (k === 2 ? 1 : 0.5));
      });
      Pl.dot(s.b[0], s.b[1], 7, "fill:var(--c2);stroke:var(--paper);stroke-width:2;cursor:grab");
      Pl.add('<text x="' + (Pl.x(s.b[0]) + 10).toFixed(1) + '" y="' + (Pl.y(s.b[1]) - 10).toFixed(1) + '" class="t-halo t-ink t-b">ŵ sans pénalité</text>');
      Pl.dot(sol.p[0], sol.p[1], 6.5, "fill:var(--c-fit);stroke:var(--paper);stroke-width:2");
      const el = $("#w-geo");
      el.innerHTML = Pl.svg("Région de contrainte, lignes de niveau et solution pénalisée");
      const zero = (v) => Math.abs(v) < 0.012;
      $("#geo-read").innerHTML = "<span>ŵ pénalisé = (<b>" + N(zero(sol.p[0]) ? 0 : sol.p[0], 2) + "</b> ; <b>" + N(zero(sol.p[1]) ? 0 : sol.p[1], 2) + "</b>)</span>" +
        (sol.inside ? '<span class="badge badge--info">' + ICON.info + "Dans le budget : pas de rétrécissement</span>" : zero(sol.p[0]) || zero(sol.p[1]) ? '<span class="badge badge--ok">' + ICON.check + "Contact sur un coin : un coefficient vaut 0</span>" : '<span class="badge badge--warn">' + ICON.info + "Contact sur un bord : les deux sont rétrécis</span>");
      const svg = el.querySelector("svg");
      const move = (ev) => { if (!this.dragging) return; const p = VIZ.svgPoint(svg, ev); s.b = [ENG.clamp(Pl.x.inv(p.x), -2.9, 2.9), ENG.clamp(Pl.y.inv(p.y), -2.5, 2.5)]; this.draw(); };
      svg.addEventListener("pointerdown", (ev) => { this.dragging = true; ev.preventDefault(); move(ev); });
      svg.addEventListener("pointermove", move);
    },
    init() { if (!this.bound) { this.bound = true; window.addEventListener("pointerup", () => (this.dragging = false)); } this.draw(); },
    input(t) { const s = this.st; if (t.id === "geo-t") { s.t = +t.value; $("#geo-t-o").textContent = N(s.t, 2); } else if (t.id === "geo-rho") { s.rho = +t.value; $("#geo-rho-o").textContent = N(s.rho, 2); } else return false; this.draw(); return true; },

      const Pl = VIZ.Plot({ w: 560, h: 280, x: [0, 1], y: [0, 0.55], xlabel: "part de positifs p dans le nœud", ylabel: "impureté", m: { t: 14, r: 14, b: 32, l: 40 } });

  const giniOf = (ys) => { if (!ys.length) return 0; const p = ENG.mean(ys); return 2 * p * (1 - p); };

      pis.forEach((q, k) => { Pp.path(us.map((u) => { const R = 1 - Phi(u - d), F = 1 - Phi(u); return [R, (R * q) / (R * q + F * (1 - q))]; }), "stroke:" + cols[k] + ";stroke-width:2.4"); Pp.hline(q, "stroke:" + cols[k] + ";stroke-dasharray:3 4;stroke-opacity:.6"); });
      $("#w-pr").innerHTML = Pp.svg("Courbes précision-rappel pour quatre prévalences");
      $("#auc-read").innerHTML = "<span>ROC-AUC = Φ(d/√2) = <b>" + N(Phi(d / Math.SQRT2), 3) + "</b> pour toutes les prévalences</span>" + pis.map((q, k) => '<span><i class="swatch" style="display:inline-block;margin-right:6px;background:' + cols[k] + '"></i>π = ' + Math.round(q * 100) + " % : PR-AUC = <b>" + N(scoreModel(d, q, 0).ap, 3) + "</b> (hasard : " + N(q, 2) + ")</span>").join("");
    },
    init() { this.draw(); },
    input(t) { if (t.id !== "auc-d") return false; this.st.d = +t.value; $("#auc-d-o").textContent = N(this.st.d, 2); this.draw(); return true; },
  };
  // Calibration
  const CALD = (() => { const r = ENG.rng(77), p = [], y = []; for (let i = 0; i < 3000; i++) { const z = 2.2 * ENG.gauss(r) - 0.8, q = ENG.sigmoid(z); p.push(q); y.push(r() < q ? 1 : 0); } return { p, y }; })();
  W.cal = {
    st: { T: 1, s: 0 },
    html() {
      return wrap("Diagramme de fiabilité : des probabilités faussées, un classement intact", "interactif",
        '<div class="b-opts"><div class="field" style="min-width:240px">' + rangeCtl("cal-T", "Confiance (multiplie le logit)", { min: 0.3, max: 3, step: 0.05, value: this.st.T, out: N(this.st.T, 2) }) + '</div><div class="field" style="min-width:240px">' + rangeCtl("cal-s", "Décalage (ex. class_weight)", { min: -2, max: 2, step: 0.05, value: this.st.s, out: N(this.st.s, 2) }) + "</div></div>" +
        '<div class="wgrid"><div class="chart" id="w-cal"></div><div class="stack"><div class="dec" id="cal-bars"></div><p class="note">Confiance > 1 : probabilités trop extrêmes (arbre profond, boosting long). < 1 : trop timides (forte régularisation). Décalage > 0 : tout est poussé vers la classe 1 (repondération). La ROC-AUC ne bouge jamais : seul l\'ordre compte pour elle.</p></div></div>');
    },
    draw() {
      const s = this.st, q = CALD.p.map((p) => ENG.sigmoid(s.T * Math.log(p / (1 - p)) + s.s)), bins = 10, cnt = new Array(bins).fill(0), sp = new Array(bins).fill(0), sy = new Array(bins).fill(0);
      q.forEach((v, i) => { const b = Math.min(bins - 1, Math.floor(v * bins)); cnt[b]++; sp[b] += v; sy[b] += CALD.y[i]; });
      const Pl = VIZ.Plot({ w: 520, h: 400, x: [0, 1], y: [0, 1], xlabel: "probabilité annoncée (moyenne du bin)", ylabel: "fréquence observée des positifs", m: { t: 14, r: 14, b: 34, l: 44 } });
      Pl.grid(5, 5).seg(0, 0, 1, 1, "stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 4");
      const mx = Math.max(...cnt);
      cnt.forEach((c, b) => { if (c) Pl.rect(b / bins + 0.005, 0, (b + 1) / bins - 0.005, (0.18 * c) / mx, "fill:var(--accent);fill-opacity:.18;rx:2"); });
      const pts = cnt.map((c, b) => (c >= 15 ? [sp[b] / c, sy[b] / c] : null)).filter(Boolean);
      Pl.path(pts, "stroke:var(--c2);stroke-width:2.6"); pts.forEach((p) => Pl.dot(p[0], p[1], 5, "fill:var(--c2);stroke:var(--paper);stroke-width:1.5"));
      Pl.text(0.03, 0.95, "diagonale = calibration parfaite · barres = nombre de cas par bin", "t-halo t-ink2", "start");
      $("#w-cal").innerHTML = Pl.svg("Diagramme de fiabilité des probabilités");
      const ll = ENG.logloss(q, CALD.y), br = ENG.brier(q, CALD.y), auc = ENG.rocAuc(q, CALD.y), ll0 = ENG.logloss(CALD.p, CALD.y), br0 = ENG.brier(CALD.p, CALD.y);
      const row = (l, v, ref, c) => '<div class="dec__row"><span>' + l + '</span><div class="dec__bar"><i style="width:' + Math.min(100, (v / Math.max(ref * 2, 1e-9)) * 100).toFixed(1) + "%;background:" + c + '"></i></div><b>' + N(v, 3) + "</b></div>";
      $("#cal-bars").innerHTML = row("Log-loss", ll, ll0, "var(--c2)") + row("Brier", br, br0, "var(--c7)") + '<div class="dec__row"><span>ROC-AUC</span><div class="dec__bar"><i style="width:' + (auc * 100).toFixed(1) + '%;background:var(--c1)"></i></div><b>' + N(auc, 3) + "</b></div>" +
        '<p class="note">' + fmt("Calibration parfaite : log-loss " + N(ll0, 3) + ", Brier " + N(br0, 3) + ".") + "</p>";
    },
    init() { this.draw(); },
    input(t) { const s = this.st; if (t.id === "cal-T") { s.T = +t.value; $("#cal-T-o").textContent = N(s.T, 2); } else if (t.id === "cal-s") { s.s = +t.value; $("#cal-s-o").textContent = N(s.s, 2); } else return false; this.draw(); return true; },
  };
  // Biais du gagnant
  W.optim = {
    st: { n: 40, k: 5, seed: 1 },
    html() {
      const s = this.st;
      return wrap("Le biais du gagnant : N configurations aussi bonnes les unes que les autres", "simulation",
        '<div class="b-opts"><div class="field" style="min-width:220px">' + rangeCtl("op-n", "Configurations testées N", { min: 1, max: 200, value: s.n, out: s.n }) + '</div><div class="field" style="min-width:200px">' + rangeCtl("op-k", "Folds K", { min: 2, max: 20, value: s.k, out: s.k }) + '</div><button type="button" class="btn" id="op-seed">' + ICON.dice + "<span>Nouveau tirage</span></button></div>" +
        '<div class="wgrid"><div class="chart" id="w-op"></div><div class="readout" id="op-read"></div></div>');
    },
    draw() {
      const s = this.st, r = ENG.rng(s.seed * 13 + 1), est = [];
      for (let j = 0; j < s.n; j++) { let m = 0; for (let k = 0; k < s.k; k++) m += 0.6 + 0.09 * ENG.gauss(r); est.push(m / s.k); }
      const best = est.reduce((a, v, i) => (v > est[a] ? i : a), 0);
      const Pl = VIZ.Plot({ w: 560, h: 280, x: [0, Math.max(2, s.n + 1)], y: [0.45, 0.75], xlabel: "configuration", ylabel: "PR-AUC estimée par CV", m: { t: 16, r: 14, b: 34, l: 44 } });
      Pl.grid(5, 6).hline(0.6, "stroke:var(--ink);stroke-width:1.6;stroke-dasharray:6 4", "vraie PR-AUC = 0,60 pour toutes");
      est.forEach((v, i) => Pl.dot(i + 1, v, i === best ? 7 : 3.6, i === best ? "fill:var(--c2);stroke:var(--paper);stroke-width:2" : "fill:var(--accent);fill-opacity:.7"));
      $("#w-op").innerHTML = Pl.svg("Estimations de CV de configurations identiques ; la meilleure en orange");
      $("#op-read").innerHTML = "<span>Meilleure estimation (« best_score_ ») : <b>" + N(est[best], 3) + "</b></span><span>Vraie valeur : <b>0,600</b></span><span>Optimisme : <b>+" + N(est[best] - 0.6, 3) + "</b></span><p class=\"note\">Toutes les configurations sont identiques : seule la chance les départage. Plus N est grand, plus le gagnant est flatteur ; d'où le test final tenu à l'écart.</p>";
    },
    init() { this.draw(); },
    input(t) { const s = this.st; if (t.id === "op-n") { s.n = +t.value; $("#op-n-o").textContent = s.n; } else if (t.id === "op-k") { s.k = +t.value; $("#op-k-o").textContent = s.k; } else return false; this.draw(); return true; },
    click(b) { if (b.id !== "op-seed") return false; this.st.seed++; this.draw(); return true; },
  };

  /* ------------------------------------------------------------- rendu */
  function renderMaths() {
    const topic = (t) => '<section class="sec mtopic" id="' + t.id + '" aria-labelledby="' + t.id + '-h"><header class="sec__head"><span class="sec__ico">' + ICON[t.icon] + '</span><h2 id="' + t.id + '-h">' + esc(t.title) + "</h2></header>" +
      '<div class="sec__body"><div class="simple"><div class="simple__txt"><p class="sub">En bref</p>' + t.simple.map((p) => "<p>" + fmt(p) + "</p>").join("") + "</div>" +
      '<div class="keyf"><p class="sub">Formule clé</p><div class="fx">' + math(t.key, true) + "</div><p>" + fmt(t.keyTxt) + "</p></div></div>" +
      '<div class="detail only-detail"><p class="detail__h">' + ICON.sigma + "En détail</p>" +
      '<ol class="steps">' + t.steps.map((st) => "<li><div><p>" + fmt(st.p) + "</p>" + (st.tex ? '<div class="fx">' + math(st.tex, true) + "</div>" : "") + "</div></li>").join("") + "</ol>" +
      t.widgets.map((w) => W[w].html()).join("") +
      (t.lab ? '<p class="note">Pour aller plus loin : <button type="button" class="btn" data-goto-lab="' + t.lab + '">' + ICON.flask + "<span>Ouvrir dans le Labo</span></button></p>" : "") + "</div>" +
      '<p class="note only-essential"><button type="button" class="btn" data-mode-switch="detailed">' + ICON.sigma + "<span>Voir la démonstration et les graphiques interactifs</span></button></p></div></section>";
    $("#page").innerHTML =
      '<header class="hero" style="grid-template-columns:minmax(0,1fr)"><div><p class="eyebrow">Comprendre · démontrer · visualiser</p><h1>Les mathématiques de la classification</h1>' +
      '<p class="hero__tag" style="max-width:74ch">Chaque notion a deux niveaux. <b>Essentiel</b> : l\'idée en mots simples et la formule clé. <b>Détaillé</b> : la démonstration pas à pas et des graphiques interactifs.</p></div></header>' +
      '<nav class="jump no-print" aria-label="Notions"><span>Notions</span>' + MT.map((t) => '<button type="button" data-jump="' + t.id + '">' + esc(t.title) + "</button>").join("") + "</nav>" +
      MT.map(topic).join("");
    if (state.mode === "detailed") initMathWidgets();
  }
  function initMathWidgets() { if (state.view !== "maths") return; Object.keys(W).forEach((k) => { if (W[k].init) W[k].init(); }); }
  function mathInput(t) { return Object.keys(W).some((k) => W[k].input && W[k].input(t)); }
  function mathClick(b) {
    const sg = b.closest("[data-seg]");
    if (sg && b.dataset.val != null) {
      const hit = Object.keys(W).some((k) => W[k].seg && W[k].seg(sg.dataset.seg, b.dataset.val));
      if (hit) $$("button", sg).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return hit;
    }
    return Object.keys(W).some((k) => W[k].click && W[k].click(b));
  }

  /* ==========================================================================
     Navigation et événements
     ========================================================================== */
  function renderTop() {
    $("#views").innerHTML = VIEWS.map((v) => '<button type="button" class="view-btn" data-view="' + v[0] + '"' + (state.view === v[0] ? ' aria-current="page"' : "") + ">" + ICON[v[2]] + '<span class="vl-long">' + v[1] + '</span><span class="vl-short">' + v[3] + "</span></button>").join("");
    $("#tabs-row").hidden = state.view !== "models";
    $("#tabs").innerHTML = '<span class="tab__grp">Linéaire</span>' + MODELS.slice(0, 1).map(tabBtn).join("") + '<span class="tab__grp">Arbres</span>' + MODELS.slice(1).map(tabBtn).join("");
    $$("button[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px");
  }
  const tabBtn = (m) => '<button type="button" class="tab" role="tab" id="tab-' + m.id + '" data-m="' + m.id + '" aria-selected="' + (m.id === state.model) + '" tabindex="' + (m.id === state.model ? 0 : -1) + '" title="' + esc(m.label) + '">' + esc(m.cls) + "</button>";
  function render(scrollTo) {
    stopTimers();
    const app = $("#app");
    app.dataset.view = state.view; app.dataset.mode = state.mode;
    app.dataset.model = state.view === "models" ? state.model : "";
    renderTop();
    if (state.view === "models") renderModels();
    else if (state.view === "lab") renderLab();
    else if (state.view === "cv") renderCV();
    else if (state.view === "metrics") renderMetrics();
    else renderMaths();
    writeHash();
    if (scrollTo) requestAnimationFrame(() => { const el = document.getElementById(scrollTo); if (el) el.scrollIntoView({ block: "start" }); });
    else window.scrollTo({ top: 0 });
  }
  function setView(v, scrollTo) { state.view = v; persist(); render(scrollTo); }
  function setModel(id, focus) {
    if (!byId(id)) return;
    state.model = id; persist(); render();
    if (focus) $("#tab-" + id).focus();
  }
  function setMode(mode) {
    state.mode = mode; persist();
    $("#app").dataset.mode = mode;
    $$("button[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    if (state.view === "maths" && mode === "detailed") initMathWidgets();
  }
  function copyFrom(btn) {
    const pre = document.getElementById(btn.dataset.copy); if (!pre) return;
    const label = $("span", btn);
    const done = (txt) => { label.textContent = txt; btn.classList.add("is-done"); setTimeout(() => { label.textContent = "Copier"; btn.classList.remove("is-done"); }, 1600); };
    const text = pre.innerText;
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand("copy"); done("Copié"); } catch (e) { done("Sélectionné"); }
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done("Copié"), fallback);
    else fallback();
  }

  document.addEventListener("click", (e) => {
    const t = e.target;
    const v = t.closest("button[data-view]"); if (v) { setView(v.dataset.view); return; }
    const tab = t.closest("button[data-m]"); if (tab) { setModel(tab.dataset.m); return; }
    const md = t.closest("button[data-mode]"); if (md) { setMode(md.dataset.mode); return; }
    const ms = t.closest("[data-mode-switch]"); if (ms) { const sec = ms.closest(".sec"); setMode(ms.dataset.modeSwitch); if (sec) sec.scrollIntoView({ block: "start" }); return; }
    if (t.closest("#theme-btn")) { cycleTheme(); return; }
    const j = t.closest("[data-jump]"); if (j) { const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    const c = t.closest("[data-copy]"); if (c) { copyFrom(c); return; }
    const ol = t.closest("[data-open-lab]"); if (ol) { lab.model = ol.dataset.openLab; lab.sweep = null; setView("lab"); return; }
    const gl = t.closest("[data-goto-lab]"); if (gl) { setView("lab", gl.dataset.gotoLab); return; }
    const gf = t.closest("[data-goto-fiche]"); if (gf) { state.model = gf.dataset.gotoFiche; setView("models"); return; }
    const pd = t.closest("[data-pd]");
    if (pd) {
      const open = state.open[state.model] || (state.open[state.model] = {});
      const n = pd.dataset.pd, on = pd.getAttribute("aria-expanded") !== "true";
      open[n] = on; pd.setAttribute("aria-expanded", String(on));
      document.getElementById(pd.getAttribute("aria-controls")).hidden = !on;
      pd.closest("tr").classList.toggle("is-open", on);
      return;
    }
    // constructeur
    const chip = t.closest("[data-chip]");
    if (chip) {
      const st = B(), n = chip.dataset.chip, val = chip.dataset.v, arr = st.sel[n], i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
      chip.setAttribute("aria-pressed", String(i < 0)); refreshBuilder(); return;
    }
    const add = t.closest("[data-add]"); if (add) { addValue(add.dataset.add); return; }
    const bp = t.closest("[data-bpreset]");
    if (bp) {
      const m = byId(state.model), st = B(), k = bp.dataset.bpreset;
      m.params.forEach((p) => { if (p.g) st.sel[p.n] = k === "none" ? [] : k === "p1" ? (p.prio === 1 ? p.g.sel.slice() : []) : p.g.sel.slice(); });
      st.es = false;
      $("#b-rows").innerHTML = builderRows(m, st); refreshBuilder(); return;
    }
    const wp = t.closest("[data-wfpreset]"); if (wp) { applyWorkflow(wp.dataset.wfpreset); return; }
    const sg = t.closest("[data-seg] button");
    if (sg && state.view === "models") {
      const name = sg.closest("[data-seg]").dataset.seg, val = sg.dataset.val;
      if (name === "search" || name === "codeMode" || name === "api" || name === "es") {
        if (name === "es") B().es = val === "1"; else state.opts[name] = val;
        persist();
        $$("button", sg.parentNode).forEach((x) => x.setAttribute("aria-pressed", String(x === sg)));
        const f = $("#f-niter"); if (f) f.hidden = state.opts.search !== "random";
        refreshBuilder(); return;
      }
    }
    if (state.view === "lab" && labClick(e)) return;
    if (state.view === "maths") { const b = t.closest("button"); if (b && mathClick(b)) return; }
  });
  function addValue(n) {
    const m = byId(state.model), p = m.params.find((x) => x.n === n), st = B(), inp = document.getElementById("add-" + n);
    const row = inp.closest(".brow"), err = $(".brow__err", row);
    const r = validate(p.g.custom, inp.value);
    if (r.err) { err.textContent = r.err; err.hidden = false; return; }
    err.hidden = true;
    if (!cands(p, st).includes(r.v)) st.custom[n].push(r.v);
    if (!st.sel[n].includes(r.v)) st.sel[n].push(r.v);
    $("#b-rows").innerHTML = builderRows(m, st); refreshBuilder();
    const again = document.getElementById("add-" + n); if (again) again.focus();
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.addin) { e.preventDefault(); addValue(e.target.dataset.addin); }
    const tab = e.target.closest && e.target.closest(".tab");
    if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const ids = MODELS.map((m) => m.id), i = ids.indexOf(state.model);
      setModel(ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length], true);
      e.preventDefault();
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "ref-q") {
      const q = t.value.trim().toLowerCase(); let n = 0;
      $$(".rrow").forEach((r) => { const ok = !q || r.dataset.s.includes(q); r.hidden = !ok; if (ok) n++; });
      $$(".rtable tr.grp").forEach((g) => { let s = g.nextElementSibling, any = false; while (s && !s.classList.contains("grp")) { if (!s.hidden) any = true; s = s.nextElementSibling; } g.hidden = !any; });
      $("#ref-n").textContent = n + " paramètre" + (n > 1 ? "s" : "");
      return;
    }
    if (t.id === "opt-folds" || t.id === "opt-niter") {
      const v = parseInt(t.value, 10);
      if (t.id === "opt-folds" && v >= 2 && v <= 20) state.opts.folds = v;
      if (t.id === "opt-niter" && v >= 1 && v <= 5000) state.opts.nIter = v;
      persist(); refreshBuilder(); return;
    }
    if (state.view === "metrics" && MET_SIM.input(t)) return;
    if (state.view === "lab" && labInput(e)) return;
    if (state.view === "maths") mathInput(t);
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "opt-cv" || t.id === "opt-refit") { state.opts[t.id.slice(4)] = t.value; persist(); refreshBuilder(); return; }
    if (state.view === "lab" && labChange(e)) return;
    if (state.view === "maths" && t.type === "checkbox") mathInput(t);
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  /* Les cartes de probabilité sont des images : on les recalcule quand le thème change. */
  function onThemeChange() {
    if (state.view === "lab") labUpdate();
    if (state.view === "maths" && state.mode === "detailed") W.bound.draw();
  }
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onThemeChange); } catch (e) { /* ancien navigateur */ }
  window.addEventListener("resize", debounce(() => document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px"), 150));

  /* ----------------------------------------------------------- démarrage */
  const fromHash = readHash();
  if (!location.hash && saved.view && HASH[saved.view]) state.view = saved.view;
  themeIcon();
  render(state.view === "maths" && fromHash ? fromHash : null);
})();
</script>
</body>
