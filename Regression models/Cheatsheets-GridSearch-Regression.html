        { cls: "sec--solid" }) +
      section("sec-vc", "curve", "Complexité : le compromis biais ↔ variance",
        '<p class="lede">À gauche, la <b>courbe de validation</b> : erreur d\'entraînement et erreur de validation croisée (5 folds) quand on fait varier un hyperparamètre — exactement ce que fait un GridSearch sur une dimension. À droite, 30 jeux de données tirés de la même loi : l\'écart entre les courbes, c\'est la <b>variance</b> ; l\'écart entre leur moyenne et la vraie fonction, c\'est le <b>biais</b>.</p>' +
        '<div class="cols2"><div class="stack"><div class="b-opts" id="vc-opts"></div><div class="chart" id="ch-vc"></div><div class="legend">' +
        "<span>" + swatch("var(--c1)", "line") + "RMSE entraînement</span><span>" + swatch("var(--c2)", "line") + "RMSE de CV (moyenne ± écart-type)</span><span>" + swatch("var(--muted)", "line") + "plancher : bruit irréductible</span></div><p class=\"note\" id=\"vc-read\"></p></div>" +
        '<div class="stack"><div class="chart" id="ch-bv"></div><div class="legend"><span>' + swatch("var(--c3)", "line") + "30 modèles</span><span>" + swatch("var(--c-fit)", "line") + "leur moyenne</span><span>" + swatch("var(--muted)", "line") + "vraie fonction</span></div>" +
        '<div class="dec" id="bv-dec"></div><p class="note">Erreur de test attendue ≈ biais² + variance + bruit. Les trois termes sont estimés sur une grille de x.</p></div></div>') +
      section("sec-cvanim", "split", "La validation croisée, pli par pli",
        '<p class="lede">Chaque fold cache une partie du jeu d\'entraînement, entraîne le modèle sur le reste et mesure l\'erreur sur la partie cachée. Le score de CV est la moyenne des folds ; l\'écart-type dit à quel point il est fiable.</p>' +
        '<div class="b-opts" id="cv-opts"></div>' +
        '<div class="cols2"><div class="stack"><div class="chart" id="ch-strip"></div><div class="legend"><span>' + swatch("var(--c1)") + "entraînement</span><span>" + swatch("var(--c2)") + "validation</span><span>" + swatch("var(--line)") + "inutilisé</span></div></div>" +
        '<div class="stack"><div class="chart" id="ch-fold"></div><div class="chart" id="ch-scores"></div><div class="kpi-row" id="cv-kpi"></div></div></div>' +
        '<div id="cv-note"></div>') +
      section("sec-gsviz", "grid", "GridSearch visuel",
        '<p class="lede">Chaque case est une combinaison d\'hyperparamètres évaluée par validation croisée (5 folds). Plus la case est foncée, plus la RMSE de CV est basse. Lancez la recherche pour voir le coût s\'accumuler ; en mode <b>Randomized</b>, seules <code>n_iter</code> cases sont tirées. Cliquez sur une case calculée pour l\'appliquer au banc d\'essai.</p>' +
        '<div class="b-opts" id="gs-opts"></div><div class="progress" aria-hidden="true"><i id="gs-prog"></i></div>' +
        '<div class="cols2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="chart" id="ch-gs"></div><div class="stack" id="gs-side"></div></div>') +
      section("sec-path", "sliders", "Chemins de régularisation (8 variables)",
        '<p class="lede">Jeu à 8 variables standardisées : x₁, x₂, x₃ et x₆ sont utiles (coefficients vrais 3, −2, 1,5 et 0,8), les autres sont du bruit ; x₂ est corrélée à x₁, x₅ à x₃. Faites varier α : Ridge rétrécit tout en douceur, le Lasso annule les variables une à une.</p>' +
        '<div class="b-opts" id="path-opts"></div>' +
        '<div class="cols2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="stack"><div class="chart" id="ch-path"></div><div class="chart" id="ch-pathcv"></div></div><div class="stack"><div class="chart" id="ch-coef"></div><div id="path-read"></div></div></div>');
    renderLabCtl();
    labUpdate(); vcUpdate(); cvRender(true); gsRender(); pathRender(true);
  }

  /* ------------------------------------------------------------- contrôles */
  function renderLabCtl() {
    const opt = (id, cur, opts) => '<select id="' + id + '" class="sel" style="width:100%">' + opts.map((o) => '<option value="' + o[0] + '"' + (o[0] === cur ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>";
    $("#lab-ctl").innerHTML =
      '<div class="ctl"><h3>Données</h3>' +
      '<div class="field"><label for="lab-shape">Vraie fonction</label>' + opt("lab-shape", lab.shape, Object.keys(ENG.SHAPES).map((k) => [k, ENG.SHAPES[k].label])) + "</div>" +
      rangeCtl("lab-n", "Nombre de points", { min: 20, max: 300, step: 5, value: lab.n, out: lab.n }) +
      rangeCtl("lab-noise", "Bruit σ", { min: 0, max: 1, step: 0.01, value: lab.noise, out: N(lab.noise, 2) }) +
      rangeCtl("lab-outl", "Valeurs aberrantes", { min: 0, max: 0.2, step: 0.01, value: lab.outl, out: Math.round(lab.outl * 100) + " %" }) +
      '<div class="field"><span class="lab">Part de test</span>' + seg("testFrac", lab.testFrac, [[0.2, "20 %"], [0.3, "30 %"], [0.4, "40 %"]]) + "</div>" +
      '<div class="btnrow"><button type="button" class="btn" id="lab-seed">' + ICON.dice + '<span>Nouveau tirage</span></button><button type="button" class="btn" id="lab-clear"' + (lab.added.length ? "" : " disabled") + ">" + ICON.reset + "<span>Effacer mes points</span></button></div></div>" +
      '<div class="ctl"><h3>Modèle</h3>' + opt("lab-model", lab.model, Object.keys(LABM).map((k) => [k, LABM[k].label])) +
      '<div id="lab-params" style="display:grid;gap:10px"></div>' +
      (LABM[lab.model].fiche ? '<button type="button" class="btn" data-goto-fiche="' + LABM[lab.model].fiche + '">' + ICON.book + "<span>Voir la fiche du modèle</span></button>" : "") + "</div>" +
      '<div class="ctl"><h3>Affichage</h3><div class="toggles">' +
      chk("sh-truth", "Vraie fonction f(x)", lab.show.truth, swatch("var(--muted)", "line")) +
      chk("sh-test", "Points de test", lab.show.test, swatch("var(--c2)", "ring")) +
      chk("sh-resid", "Résidus (segments)", lab.show.resid, swatch("var(--c-err)", "line")) +
      chk("sh-squares", "Carrés des résidus", lab.show.squares, swatch("var(--c-err)")) +
      (lab.model === "rf" || lab.model === "gb" ? chk("sh-members", lab.model === "rf" ? "Arbres individuels" : "Étapes du boosting", lab.show.members, swatch("var(--c3)", "line")) : "") +
      "</div></div>";
    renderParamCtl();
  }
  function renderParamCtl() {
    const p = P();
    $("#lab-params").innerHTML = LABM[lab.model].ctl.map((c) => {
      if (c === "weights") return '<div class="field"><span class="lab">weights</span>' + seg("knnw", p.weights, [["uniform", "uniform"], ["distance", "distance"]]) + "</div>";
      const C = CTL[c], v = p[C.key];
      return rangeCtl("pc-" + c, C.label, { min: C.min, max: C.max, step: C.step || (C.log ? 0.05 : 1), value: C.log ? Math.log10(v) : v, out: ctlVal(c, v), hint: C.hint, data: 'data-pc="' + c + '"' });
    }).join("");
  }

  /* ---------------------------------------------------------- banc d'essai */
  let FIT = null;
  function labUpdate() {
    const tr = trainSet(), p = P();
    FIT = ENG.fit(lab.model, tr.x, tr.y, p);
    const f = FIT, H = 380;
    const Pl = VIZ.Plot({ w: 720, h: H, x: [0, 1], y: D.ydom, xlabel: "x", ylabel: "y", m: { t: 16, r: 16, b: 34, l: 44 } });
    Pl.grid(8, 6);
    const curve = (g, n) => lineOf(g, 0, 1, n || 300);
    if (lab.show.truth) Pl.path(curve(D.f, 200), "stroke:var(--muted);stroke-width:1.8;stroke-dasharray:6 5");
    if (lab.show.squares) tr.x.forEach((x, i) => {
      const yh = f(x), side = Math.abs(Pl.y(tr.y[i]) - Pl.y(yh)) / (Pl.x(1) - Pl.x(0));
      Pl.rect(x, yh, x + (i % 2 ? side : -side), tr.y[i], "fill:var(--c-err);fill-opacity:.08;stroke:var(--c-err);stroke-opacity:.45;stroke-width:1");
    });
    if (lab.show.resid) {
      tr.x.forEach((x, i) => Pl.seg(x, tr.y[i], x, f(x), "stroke:var(--c-err);stroke-width:1.4;stroke-opacity:.8"));
      if (lab.show.test) D.test.x.forEach((x, i) => Pl.seg(x, D.test.y[i], x, f(x), "stroke:var(--c-err);stroke-width:1.2;stroke-opacity:.5;stroke-dasharray:2 2"));
    }
    if (lab.show.members && lab.model === "rf") f.trees.slice(0, 12).forEach((t) => Pl.path(curve(t, 260), "stroke:var(--c3);stroke-width:1;stroke-opacity:.4"));
    if (lab.show.members && lab.model === "gb") [1, 3, 10, 30].filter((k) => k < p.rounds).forEach((k, j) => Pl.path(curve((x) => f(x, k), 260), "stroke:var(--c3);stroke-width:1.3;stroke-opacity:" + (0.3 + j * 0.15)));
    if (lab.show.test) D.test.x.forEach((x, i) => Pl.dot(x, D.test.y[i], 4.2, "fill:var(--paper);stroke:var(--c2);stroke-width:2"));
    D.train.x.forEach((x, i) => Pl.dot(x, D.train.y[i], 4.2, "fill:var(--c1);stroke:var(--paper);stroke-width:1.2"));
    lab.added.forEach((a) => Pl.dot(a[0], a[1], 5.5, "fill:var(--c1);stroke:var(--ink);stroke-width:2"));
    Pl.path(curve(f, lab.model === "knn" || lab.model === "tree" || lab.model === "rf" || lab.model === "gb" ? 500 : 240), "stroke:var(--c-fit);stroke-width:2.8");
    const el = $("#ch-fit");
    el.innerHTML = Pl.svg("Données simulées et prédiction du modèle " + LABM[lab.model].label);
    const pts = [];
    tr.x.forEach((x, i) => pts.push({ px: Pl.x(x), py: Pl.y(tr.y[i]), k: i >= D.train.x.length ? "Point ajouté" : "Entraînement", x, y: tr.y[i], c: "var(--c1)" }));
    if (lab.show.test) D.test.x.forEach((x, i) => pts.push({ px: Pl.x(x), py: Pl.y(D.test.y[i]), k: "Test", x, y: D.test.y[i], c: "var(--c2)" }));
    VIZ.hover(el, Pl, (pt) => {
      const o = VIZ.nearest(pts, pt, 14);
      if (o) {
        const yh = f(o.x);
        return { html: VIZ.sw(o.c) + "<b>" + o.k + "</b><br>x = " + N(o.x, 3) + " · y = " + N(o.y, 2) + "<br>ŷ = " + N(yh, 2) + " · résidu = " + (o.y - yh >= 0 ? "+" : "") + N(o.y - yh, 2), marks: '<circle cx="' + o.px + '" cy="' + o.py + '" r="8" style="fill:none;stroke:var(--ink);stroke-width:1.5"/>' };
      }
      const x = Pl.x.inv(pt.x); if (x < 0 || x > 1) return null;
      return { html: "x = " + N(x, 3) + "<br>ŷ = " + N(f(x), 2) + (lab.show.truth ? " · f(x) = " + N(D.f(x), 2) : "") + '<br><span style="opacity:.75">Cliquer pour ajouter un point</span>', marks: '<line x1="' + pt.x + '" x2="' + pt.x + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/><circle cx="' + pt.x + '" cy="' + Pl.y(f(x)) + '" r="4.5" style="fill:var(--c-fit)"/>' };
    });
    el.querySelector("svg").addEventListener("click", (ev) => {
      const pt = VIZ.svgPoint(el.querySelector("svg"), ev), x = Pl.x.inv(pt.x), y = Pl.y.inv(pt.y);
      if (x < 0 || x > 1 || y < D.ydom[0] || y > D.ydom[1]) return;
      lab.added.push([x, y]); onModelChange(true);
      const b = $("#lab-clear"); if (b) b.disabled = false;
    });
    $("#fit-legend").innerHTML = "<span>" + swatch("var(--c1)") + "entraînement (" + tr.x.length + ")</span>" + (lab.show.test ? "<span>" + swatch("var(--c2)", "ring") + "test (" + D.test.x.length + ")</span>" : "") + "<span>" + swatch("var(--c-fit)", "line") + "prédiction ŷ</span>" + (lab.show.truth ? "<span>" + swatch("var(--muted)", "line") + "vraie fonction</span>" : "") + (lab.added.length ? "<span>" + lab.added.length + " point(s) ajouté(s)</span>" : "");
    // métriques
    const sTr = ENG.scores(f, tr.x, tr.y), sTe = ENG.scores(f, D.test.x, D.test.y);
    const floor = Math.sqrt(D.noise.var); // bruit irréductible théorique
    $("#lab-metrics").innerHTML =
      '<div class="metric"><span>RMSE entraînement</span><b>' + N(sTr.rmse, 3) + "</b><small>R² = " + N(sTr.r2, 3) + "</small></div>" +
      '<div class="metric"><span>RMSE test</span><b>' + N(sTe.rmse, 3) + "</b><small>R² = " + N(sTe.r2, 3) + "</small></div>" +
      '<div class="metric"><span>MAE test</span><b>' + N(sTe.mae, 3) + "</b><small>MedAE = " + N(sTe.medae, 3) + "</small></div>" +
      '<div class="metric"><span>Bruit irréductible σ</span><b>' + N(floor, 3) + "</b><small>RMSE minimale attendue</small></div>";
    let b;
    if (sTr.rmse < 0.9 * floor && sTe.rmse > 1.15 * floor && sTe.rmse > 1.25 * sTr.rmse) b = ["bad", ICON.warn, "Surapprentissage", "Le modèle colle au bruit du train (RMSE train ≪ plancher) et généralise mal."];
    else if (sTr.rmse > 1.18 * floor && sTe.rmse > 1.18 * floor) b = ["warn", ICON.info, "Sous-apprentissage", "Train et test sont loin du plancher : le modèle est trop simple ou trop régularisé."];
    else b = ["ok", ICON.check, "Bon compromis", "L'erreur de test est proche du bruit irréductible."];
    $("#lab-diag").innerHTML = '<span class="badge badge--' + b[0] + '">' + b[1] + b[2] + "</span><span>" + b[3] + " Écart test / train : ×" + N(sTe.rmse / (sTr.rmse || 1e-9), 2) + ".</span>";
    resUpdate(f, tr);
  }
  function resUpdate(f, tr) {
    const rs = tr.x.map((x, i) => tr.y[i] - f(x)), rt = D.test.x.map((x, i) => D.test.y[i] - f(x));
    const ext = VIZ.extent(rs.concat(lab.show.test ? rt : []), 0.1), lim = Math.max(Math.abs(ext[0]), Math.abs(ext[1]));
    const Pl = VIZ.Plot({ w: 720, h: 190, x: [0, 1], y: [-lim, lim], xlabel: "x", m: { t: 10, r: 16, b: 30, l: 44 } });
    Pl.grid(8, 4).hline(0, "stroke:var(--ink-2);stroke-width:1.2");
    if (lab.show.test) D.test.x.forEach((x, i) => Pl.dot(x, rt[i], 3.6, "fill:var(--paper);stroke:var(--c2);stroke-width:1.8"));
    tr.x.forEach((x, i) => Pl.dot(x, rs[i], 3.6, "fill:var(--c1)"));
    $("#ch-res").innerHTML = Pl.svg("Résidus en fonction de x");
  }

  /* -------------------------------------------- courbe de validation + biais/variance */
  const sweepOpts = () => LABM[lab.model].ctl.filter((c) => c !== "weights");
  function vcValues(c) { return c === "rounds" ? null : CTL[c].sweep; }
  const vcUpdate = debounce(() => {
    if (!$("#ch-vc")) return;
    const c = lab.sweep && sweepOpts().includes(lab.sweep) ? lab.sweep : LABM[lab.model].sweep;
    lab.sweep = c;
    $("#vc-opts").innerHTML = '<div class="field"><span class="lab">Hyperparamètre balayé</span>' + seg("sweep", c, sweepOpts().map((s) => [s, CTL[s].key === "alpha" ? "α" : CTL[s].key === "l1" ? "l1_ratio" : CTL[s].label.split(" ")[0]])) + '</div><span class="note">5 folds KFold mélangé sur le jeu d\'entraînement.</span>';
    const tr = trainSet(), fl = ENG.folds("kfold-shuffle", tr.x.length, 5, lab.seed), base = P(), C = CTL[c];
    let rows = [];
    if (c === "rounds") {
      const maxR = 400, per = fl.map((F) => {
        const f = ENG.fitBoost(F.train.map((i) => tr.x[i]), F.train.map((i) => tr.y[i]), Object.assign({}, base, { rounds: maxR }), [{ x: F.val.map((i) => tr.x[i]), y: F.val.map((i) => tr.y[i]) }]);
        return f.staged[0].err;
      });
      const full = ENG.fitBoost(tr.x, tr.y, Object.assign({}, base, { rounds: maxR }), [tr]);
      const pick = [1, 2, 3, 5, 8, 12, 18, 25, 35, 50, 70, 100, 140, 200, 280, 400];
      rows = pick.map((r) => { const s = per.map((e) => e[r - 1]); return { v: r, cv: ENG.mean(s), sd: ENG.std(s), tr: full.staged[0].err[r - 1] }; });
    } else {
      rows = vcValues(c).map((v) => {
        const p = Object.assign({}, base, { [C.key]: v });
        const r = ENG.cv(lab.model, tr.x, tr.y, p, fl);
        return { v, cv: r.mean, sd: r.std, tr: ENG.rmse(ENG.fit(lab.model, tr.x, tr.y, p), tr.x, tr.y) };
      });
    }
    const floor = Math.sqrt(D.noise.var);
    const log = c === "rounds" || C.log;
    const ymax = Math.min(Math.max(...rows.map((r) => r.cv + r.sd)) * 1.05, Math.max(...rows.map((r) => r.tr), floor) * 4 + 0.2);
    const Pl = VIZ.Plot({ w: 560, h: 320, x: [rows[0].v, rows[rows.length - 1].v], xlog: log, y: [0, ymax], xlabel: C.label.split(" (")[0] + (log ? " (log)" : ""), ylabel: "RMSE", xfmt: C.log ? VIZ.fmtAlpha : VIZ.num, m: { t: 18, r: 16, b: 36, l: 44 } });
    Pl.grid(6, 5);
    Pl.area(rows.map((r) => [r.v, Math.min(ymax, r.cv + r.sd), Math.max(0, r.cv - r.sd)]), "fill:var(--c2);fill-opacity:.14");
    Pl.hline(floor, "stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5", "bruit σ ≈ " + N(floor, 2));
    Pl.path(rows.map((r) => [r.v, r.tr]), "stroke:var(--c1);stroke-width:2.2");
    Pl.path(rows.map((r) => [r.v, Math.min(r.cv, ymax * 1.5)]), "stroke:var(--c2);stroke-width:2.6");
    rows.forEach((r) => { Pl.dot(r.v, r.tr, 3, "fill:var(--c1)"); if (r.cv <= ymax) Pl.dot(r.v, r.cv, 3.4, "fill:var(--c2)"); });
    const best = rows.reduce((a, r) => (r.cv < a.cv ? r : a), rows[0]);
    Pl.dot(best.v, best.cv, 8, "fill:none;stroke:var(--c2);stroke-width:2.2");
    const cur = base[C.key];
    if (cur >= rows[0].v && cur <= rows[rows.length - 1].v) Pl.vline(cur, "stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3", "actuel");
    const el = $("#ch-vc");
    el.innerHTML = Pl.svg("Courbe de validation : RMSE d'entraînement et de validation croisée selon " + C.label);
    el.classList.add("chart--click");
    VIZ.hover(el, Pl, (pt) => {
      let o = rows[0], bd = Infinity;
      rows.forEach((r) => { const d = Math.abs(Pl.x(r.v) - pt.x); if (d < bd) { bd = d; o = r; } });
      const px = Pl.x(o.v);
      return { html: "<b>" + C.label.split(" (")[0] + " = " + ctlVal(c, o.v) + "</b><br>" + VIZ.sw("var(--c1)") + "train " + N(o.tr, 3) + "<br>" + VIZ.sw("var(--c2)") + "CV " + N(o.cv, 3) + " ± " + N(o.sd, 3) + '<br><span style="opacity:.75">Cliquer pour appliquer</span>',
        marks: '<line x1="' + px + '" x2="' + px + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' };
    });
    el.querySelector("svg").addEventListener("click", (ev) => {
      const pt = VIZ.svgPoint(el.querySelector("svg"), ev);
      let o = rows[0], bd = Infinity;
      rows.forEach((r) => { const d = Math.abs(Pl.x(r.v) - pt.x); if (d < bd) { bd = d; o = r; } });
      P()[C.key] = o.v; renderParamCtl(); onModelChange();
    });
    $("#vc-read").innerHTML = fmt("Meilleure valeur en CV : **" + ctlVal(c, best.v) + "** (RMSE " + N(best.cv, 3) + "). " + (c === "rounds" ? "Au-delà, le boosting commence à apprendre le bruit : c'est ce que l'early stopping détecte." : "À gauche ou à droite de ce point, l'erreur de CV remonte : sous- ou surapprentissage."));
    bvUpdate();
  }, 140);

  function bvCompute(kind, p, opts, count) {
    const grid = ENG.range(61).map((i) => i / 60), curves = [];
    for (let k = 0; k < count; k++) {
      const d = ENG.resample(opts, k);
      const f = ENG.fit(kind, d.x, d.y, Object.assign({}, p, { seed: k + 1 }));
      curves.push(grid.map(f));
    }
    const target = grid.map((x) => opts.f(x) + opts.mu);
    const avg = grid.map((_, j) => ENG.mean(curves.map((c) => c[j])));
    const bias2 = ENG.mean(grid.map((_, j) => (avg[j] - target[j]) ** 2));
    const vari = ENG.mean(grid.map((_, j) => { const v = curves.map((c) => c[j]); return Math.pow(ENG.std(v), 2); }));
    return { grid, curves, avg, bias2, vari };
  }
  function bvChart(el, r, f, ydom, label) {
    const Pl = VIZ.Plot({ w: 560, h: 300, x: [0, 1], y: ydom, xlabel: "x", ylabel: "ŷ", m: { t: 14, r: 14, b: 32, l: 40 } });
    Pl.grid(6, 5);
    r.curves.forEach((c) => Pl.path(r.grid.map((x, j) => [x, c[j]]), "stroke:var(--c3);stroke-width:1.1;stroke-opacity:.35"));
    Pl.path(lineOf(f, 0, 1, 200), "stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5");
    Pl.path(r.grid.map((x, j) => [x, r.avg[j]]), "stroke:var(--c-fit);stroke-width:2.8");
    el.innerHTML = Pl.svg(label);
  }
  function decBars(el, r, noise) {
    const tot = r.bias2 + r.vari + noise, mx = Math.max(tot, 1e-9);
    const row = (lab_, v, c) => '<div class="dec__row"><span>' + lab_ + '</span><div class="dec__bar"><i style="width:' + ((v / mx) * 100).toFixed(1) + "%;background:" + c + '"></i></div><b>' + N(v, 3) + "</b></div>";

  /* ------------------------------------------------------- CV animée */

  function cvStep() {

    const g = ENG.fit(lab.model, F.train.map((i) => d.tr.x[i]), F.train.map((i) => d.tr.y[i]), P());
    c.scores.push(ENG.rmse(g, F.val.map((i) => d.tr.x[i]), F.val.map((i) => d.tr.y[i])));

  function gsReset() { const g = lab.gs; clearTimeout(g.timer); g.timer = null; g.cells = {}; g.order = []; g.pos = 0; g.revealed = false; g.cache = {}; }
  function gsRender() {
    if (!$("#ch-gs")) return;

    $("#gs-opts").innerHTML =
      '<div class="field"><span class="lab">Stratégie</span>' + seg("gsmode", g.mode, [["grid", "GridSearch"], ["random", "Randomized"]]) + "</div>" +
      (g.mode === "random" ? '<div class="field" style="min-width:170px">' + rangeCtl("gs-niter", "n_iter", { min: 3, max: total, value: Math.min(g.nIter, total), out: Math.min(g.nIter, total) }) + "</div>" : "") +
      '<div class="btnrow"><button type="button" class="btn btn--accent" id="gs-run">' + (g.timer ? ICON.pause + "<span>Pause</span>" : ICON.play + "<span>" + (g.pos && g.pos >= g.order.length ? "Relancer" : g.pos ? "Reprendre" : "Lancer la recherche") + "</span>") + '</button><button type="button" class="btn" id="gs-reset">' + ICON.reset + "<span>Réinitialiser</span></button>" +
      (g.mode === "random" && g.pos >= g.order.length && g.order.length ? '<button type="button" class="btn" id="gs-reveal">Révéler toute la grille</button>' : "") + "</div>";

  }
  function gsDraw(def) {

    const cw = (W - ml - mr) / C_, ch = Math.min(46, Math.max(28, 300 / R_)), H = mt + R_ * ch + mb;
    const vals = Object.values(g.cells).map((c) => c.mean);

    const bestKey = vals.length ? Object.keys(g.cells).reduce((a, k) => (g.cells[k].mean < g.cells[a].mean ? k : a), Object.keys(g.cells)[0]) : null;
    const searched = Object.keys(g.cells).filter((k) => !g.cells[k].revealed);
    const bestSearched = searched.length ? searched.reduce((a, k) => (g.cells[k].mean < g.cells[a].mean ? k : a), searched[0]) : null;
    const fmtV = (ax, v) => (ax.log ? VIZ.fmtAlpha(v) : String(v));

    s += '<text x="' + ml + '" y="14" class="t-ink t-b">' + esc(def.title) + "</text>";
    s += '<text x="' + (ml + (W - ml - mr) / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="t-ink2">' + def.cols.label + (def.cols.log ? " (échelle log)" : "") + "</text>";
    s += '<text x="12" y="' + (mt + (R_ * ch) / 2) + '" class="t-ink2" transform="rotate(-90 12 ' + (mt + (R_ * ch) / 2) + ')" text-anchor="middle">' + def.rows.label + "</text>";
    def.cols.vals.forEach((v, ci) => (s += '<text x="' + (ml + ci * cw + cw / 2) + '" y="' + (mt + R_ * ch + 16) + '" text-anchor="middle">' + fmtV(def.cols, v) + "</text>"));
    def.rows.vals.forEach((v, ri) => (s += '<text x="' + (ml - 8) + '" y="' + (mt + ri * ch + ch / 2 + 4) + '" text-anchor="end">' + fmtV(def.rows, v) + "</text>"));

      } else {

    s += "</svg>";
    const el = $("#ch-gs");
    el.innerHTML = s;
    const svg = el.querySelector("svg");
    svg.addEventListener("pointermove", (ev) => {
      const k = ev.target.dataset && ev.target.dataset.cell;
      if (!k) { VIZ.hideTip(); return; }

      VIZ.showTip("<b>" + def.rows.label + " = " + fmtV(def.rows, def.rows.vals[ri]) + "<br>" + def.cols.label + " = " + fmtV(def.cols, def.cols.vals[ci]) + "</b><br>RMSE CV = " + N(c.mean, 3) + " ± " + N(c.std, 3) + (c.revealed ? "<br>(hors tirage aléatoire)" : "") + '<br><span style="opacity:.75">Cliquer pour appliquer</span>', ev.clientX, ev.clientY);
    });

    const lbl = (k) => { const [ri, ci] = k.split(",").map(Number); return def.rows.label + " = " + fmtV(def.rows, def.rows.vals[ri]) + ", " + def.cols.label + " = " + fmtV(def.cols, def.cols.vals[ci]); };
    $("#gs-side").innerHTML =
      '<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b>' + done + " / " + planned + "</b><span>combinaisons évaluées</span></div>" +
      '<div class="stat"><b>' + nf(done * GSK) + "</b><span>fits (" + GSK + " folds chacun)</span></div></div>" +
      (bs ? callout("ok", "<strong>Meilleure trouvée :</strong> " + esc(lbl(bestSearched)) + " — RMSE CV " + N(bs.mean, 3) + ".") : '<p class="note">Lancez la recherche : les cases se remplissent dans l\'ordre où GridSearchCV les évalue.</p>') +

      '<div class="legend"><span><span class="swatch" style="background:color-mix(in oklab, var(--seq-hi) 100%, var(--seq-lo))"></span>RMSE basse</span><span><span class="swatch" style="background:color-mix(in oklab, var(--seq-hi) 8%, var(--seq-lo))"></span>RMSE haute</span><span>' + swatch("var(--c2)", "ring") + "meilleure</span></div>" +

    const g = lab.gs, def = gsDef(), R_ = def.rows.vals.length, C_ = def.cols.vals.length;
    if (g.timer) { clearTimeout(g.timer); g.timer = null; gsRender(); return; }
    if (!g.order.length || g.pos >= g.order.length) {
      gsReset();
      const all = [];
      for (let ri = 0; ri < R_; ri++) for (let ci = 0; ci < C_; ci++) all.push(ri + "," + ci);
      g.order = g.mode === "random" ? ENG.shuffle(all, ENG.rng(Date.now() & 0xffff)).slice(0, Math.min(g.nIter, all.length)) : all;
    }
    const tick = () => {
      if (g.pos >= g.order.length) { g.timer = null; gsRender(); return; }
      const k = g.order[g.pos++], [ri, ci] = k.split(",").map(Number);
      g.cells[k] = gsCell(def, ri, ci);
      gsDraw(def);
      g.timer = setTimeout(tick, Math.max(40, 1600 / g.order.length));
    };
    g.timer = setTimeout(tick, 10); gsRender();
  }
  function gsReveal() {
    const g = lab.gs, def = gsDef();
    def.rows.vals.forEach((_, ri) => def.cols.vals.forEach((__, ci) => { const k = ri + "," + ci; if (!g.cells[k]) g.cells[k] = Object.assign(gsCell(def, ri, ci), { revealed: true }); }));
    g.revealed = true; gsRender();
  }

  /* ------------------------------------------------------- chemins de régularisation */
  const PATH_CACHE = {};
  function pathData() {
    const pa = lab.path, key = pa.kind + "|" + pa.l1 + "|" + pa.seed;
    if (PATH_CACHE[key]) return PATH_CACHE[key];
    const Dd = ENG.pathData(pa.seed);
    const alphas = pa.kind === "ridge" ? ENG.logspace(-2, 4, 60) : ENG.logspace(-3.5, 0.7, 60);
    const coefs = ENG.pathAll(Dd, pa.kind, alphas, pa.l1);
    const cvr = ENG.pathCv(Dd, pa.kind, alphas, pa.l1, 5);
    return (PATH_CACHE[key] = { Dd, alphas, coefs, cvr });
  }
  function pathRender(full) {
    if (!$("#ch-path")) return;
    const pa = lab.path, a = pa.alpha[pa.kind], ar = pa.kind === "ridge" ? [-2, 4] : [-3.5, 0.7];
    if (full) $("#path-opts").innerHTML =
      '<div class="field"><span class="lab">Modèle</span>' + seg("pathkind", pa.kind, [["ridge", "Ridge"], ["lasso", "Lasso"], ["enet", "Elastic Net"]]) + "</div>" +
      '<div class="field" style="min-width:220px">' + rangeCtl("path-a", "α", { min: ar[0], max: ar[1], step: 0.02, value: Math.log10(a), out: VIZ.fmtAlpha(a) }) + "</div>" +
      (pa.kind === "enet" ? '<div class="field" style="min-width:170px">' + rangeCtl("path-l1", "l1_ratio", { min: 0.1, max: 0.95, step: 0.05, value: pa.l1, out: N(pa.l1, 2) }) + "</div>" : "") +
      '<button type="button" class="btn" id="path-seed">' + ICON.dice + "<span>Nouveau jeu</span></button>";
    const d = pathData(), A = d.alphas, p = d.Dd.p;
    const all = d.coefs.flat(), yd = VIZ.extent(all.concat([0]), 0.08);
    const Pl = VIZ.Plot({ w: 640, h: 330, x: [A[0], A[A.length - 1]], xlog: true, y: yd, xlabel: "α (échelle log)", ylabel: "coefficient", xfmt: VIZ.fmtAlpha, m: { t: 18, r: 16, b: 36, l: 44 } });
    Pl.grid(7, 6).hline(0, "stroke:var(--ink-2);stroke-width:1");
    for (let j = 0; j < p; j++) Pl.path(A.map((al, i) => [al, d.coefs[i][j]]), "stroke:var(--c" + (j + 1) + ");stroke-width:" + (ENG.TRUE_COEF[j] ? 2.4 : 1.6) + (ENG.TRUE_COEF[j] ? "" : ";stroke-dasharray:5 3"));
    // étiquettes à gauche (valeurs à α minimal), écartées si elles se chevauchent
    const lab0 = ENG.range(p).map((j) => ({ j, y: Pl.y(d.coefs[0][j]) })).sort((u, v) => u.y - v.y);
    for (let i = 1; i < lab0.length; i++) if (lab0[i].y - lab0[i - 1].y < 12) lab0[i].y = lab0[i - 1].y + 12;
    lab0.forEach((o) => Pl.add('<text x="' + (Pl.m.l + 5) + '" y="' + (o.y + 4).toFixed(1) + '" class="t-halo t-b" style="fill:var(--c' + (o.j + 1) + ')">x' + (o.j + 1) + "</text>"));
    Pl.vline(a, "stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3", "α = " + VIZ.fmtAlpha(a));
    const el = $("#ch-path");
    el.innerHTML = Pl.svg("Coefficients des 8 variables en fonction de α");
    VIZ.hover(el, Pl, (pt) => {
      const al = Pl.x.inv(pt.x); let i = 0, bd = Infinity;
      A.forEach((v, k) => { const dd = Math.abs(Math.log10(v) - Math.log10(al)); if (dd < bd) { bd = dd; i = k; } });
      const px = Pl.x(A[i]);
      return { html: "<b>α = " + VIZ.fmtAlpha(A[i]) + "</b><br>" + ENG.range(p).map((j) => VIZ.sw("var(--c" + (j + 1) + ")") + "x" + (j + 1) + " : " + N(d.coefs[i][j], 2)).join("<br>"), marks: '<line x1="' + px + '" x2="' + px + '" y1="' + Pl.m.t + '" y2="' + (Pl.H - Pl.m.b) + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>' };
    });
    // CV
    const cvr = d.cvr, ib = cvr.reduce((b, r, i) => (r.mean < cvr[b].mean ? i : b), 0);
    const thr = cvr[ib].mean + cvr[ib].se;
    let i1 = ib; for (let i = ib; i < A.length; i++) if (cvr[i].mean <= thr) i1 = i;
    const yc = VIZ.extent(cvr.map((r) => r.mean + r.se).concat(cvr.map((r) => r.mean - r.se)), 0.08);
    const Pc = VIZ.Plot({ w: 640, h: 200, x: [A[0], A[A.length - 1]], xlog: true, y: yc, xlabel: "α", ylabel: "RMSE de CV", xfmt: VIZ.fmtAlpha, m: { t: 18, r: 40, b: 34, l: 44 } });
    Pc.grid(7, 4).area(A.map((al, i) => [al, cvr[i].mean + cvr[i].se, cvr[i].mean - cvr[i].se]), "fill:var(--c2);fill-opacity:.15").path(A.map((al, i) => [al, cvr[i].mean]), "stroke:var(--c2);stroke-width:2.4");
    Pc.dot(A[ib], cvr[ib].mean, 6, "fill:var(--c2);stroke:var(--paper);stroke-width:2").dot(A[i1], cvr[i1].mean, 6, "fill:var(--paper);stroke:var(--c2);stroke-width:2.2");
    Pc.text(A[ib], cvr[ib].mean, "min", "t-halo t-ink2 t-b", "middle", -10).text(A[i1], cvr[i1].mean, "1 écart-type", "t-halo t-ink2", "middle", -10);
    Pc.vline(a, "stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3");
    $("#ch-pathcv").innerHTML = Pc.svg("Erreur de validation croisée en fonction de α");
    // barres des coefficients à α courant
    const cur = ENG.pathAll(d.Dd, pa.kind, [a], pa.l1)[0];
    const lim = Math.max(3.4, ...cur.map(Math.abs)) * 1.05;
    const Pb = VIZ.Plot({ w: 380, h: 330, x: [-lim, lim], y: [p, 0], m: { t: 18, r: 14, b: 34, l: 40 }, yticks: [] });
    Pb.grid(4, 1).vline(0, "stroke:var(--ink-2);stroke-width:1");
    for (let j = 0; j < p; j++) {
      Pb.rect(Math.min(0, cur[j]), j + 0.2, Math.max(0, cur[j]), j + 0.8, "fill:var(--c" + (j + 1) + ");rx:3");
      Pb.dot(ENG.TRUE_COEF[j], j + 0.5, 4.5, "fill:var(--paper);stroke:var(--ink);stroke-width:2");
      Pb.add('<text x="' + (Pb.m.l - 8) + '" y="' + (Pb.y(j + 0.5) + 4) + '" text-anchor="end" class="t-ink2 t-b">x' + (j + 1) + "</text>");
    }
    Pb.add('<text x="' + Pb.m.l + '" y="12" class="t-ink2">coefficients à α = ' + VIZ.fmtAlpha(a) + " · ○ vraie valeur</text>");
    $("#ch-coef").innerHTML = Pb.svg("Coefficients estimés à l'alpha courant comparés aux vraies valeurs");
    const nz = cur.filter((v) => Math.abs(v) > 1e-6).length;
    $("#path-read").innerHTML = '<div class="kpi-row"><span>Variables gardées</span><b>' + nz + " / " + p + "</b></div>" +
      '<p class="note">' + fmt("α minimisant la CV : **" + VIZ.fmtAlpha(A[ib]) + "** ; règle du « 1 écart-type » (modèle le plus simple dont l'erreur reste dans l'incertitude du meilleur) : **" + VIZ.fmtAlpha(A[i1]) + "**.") + "</p>" +
      (pa.kind === "ridge" ? callout("info", "Ridge : aucun coefficient n'atteint exactement 0. x₁ et x₂ (corrélées) se partagent le poids.") : callout("info", "Pointillés : variables inutiles. Le Lasso les annule tôt ; entre x₁ et x₂, corrélées, il peut en sacrifier une." + (pa.kind === "enet" ? " Elastic Net garde plus volontiers les deux ensemble." : "")));
  }

  /* ------------------------------------------------------- réactions */
  function onDataChange() { regen(); gsReset(); labUpdate(); vcUpdate(); cvRender(true); gsRender(); }
  function onModelChange(dataTouched, keepGs) {
    if (dataTouched) { const all = D.y.concat(lab.added.map((a) => a[1])); D.ydom = VIZ.extent(all.concat([D.f(0), D.f(1)]), 0.08); }
    labUpdate(); vcUpdate(); cvRender(true);
    if (!keepGs || dataTouched) { gsReset(); gsRender(); }
  }
  function stopTimers() { clearInterval(lab.cv.timer); lab.cv.timer = null; clearTimeout(lab.gs.timer); lab.gs.timer = null; }

  function labInput(e) {
    const t = e.target, id = t.id;
    if (id === "lab-n") { lab.n = +t.value; $("#lab-n-o").textContent = lab.n; onDataChange(); }
    else if (id === "lab-noise") { lab.noise = +t.value; $("#lab-noise-o").textContent = N(lab.noise, 2); onDataChange(); }
    else if (id === "lab-outl") { lab.outl = +t.value; $("#lab-outl-o").textContent = Math.round(lab.outl * 100) + " %"; onDataChange(); }
    else if (t.dataset.pc) {
      const c = t.dataset.pc, C = CTL[c], v = C.log ? Math.pow(10, +t.value) : +t.value;
      P()[C.key] = C.log ? +v.toPrecision(3) : v; $("#" + id + "-o").textContent = ctlVal(c, P()[C.key]);
      onModelChange(false, true);
    } else if (id === "cv-k") { lab.cv.k = +t.value; $("#cv-k-o").textContent = lab.cv.k; cvRender(true); }
    else if (id === "gs-niter") { lab.gs.nIter = +t.value; $("#gs-niter-o").textContent = lab.gs.nIter; gsReset(); gsDraw(); }
    else if (id === "path-a") { const v = Math.pow(10, +t.value); lab.path.alpha[lab.path.kind] = v; $("#path-a-o").textContent = VIZ.fmtAlpha(v); pathRender(false); }
    else if (id === "path-l1") { lab.path.l1 = +t.value; $("#path-l1-o").textContent = N(lab.path.l1, 2); pathRenderDeb(); }
    else return false;
    return true;
  }
  const pathRenderDeb = debounce(() => pathRender(false), 120);
  function labChange(e) {
    const t = e.target, id = t.id;
    if (id === "lab-shape") { lab.shape = t.value; lab.added = []; onDataChange(); renderLabCtl(); }
    else if (id === "lab-model") { lab.model = t.value; lab.sweep = null; renderLabCtl(); onModelChange(); }
    else if (id && id.startsWith("sh-")) { lab.show[id.slice(3)] = t.checked; labUpdate(); }
    else return false;
    return true;
  }
  function labClick(e) {
    const b = e.target.closest("button"); if (!b) return false;
    const sg = b.closest("[data-seg]");
    if (sg && b.dataset.val != null) {
      const n = sg.dataset.seg, v = b.dataset.val;
      if (n === "testFrac") { lab.testFrac = +v; onDataChange(); }
      else if (n === "knnw") { P().weights = v; onModelChange(false, true); }
      else if (n === "sweep") { lab.sweep = v; vcUpdate(); }
      else if (n === "cvscheme") { lab.cv.scheme = v; cvRender(true); }
      else if (n === "cvsorted") { lab.cv.sorted = v === "1"; cvRender(true); }
      else if (n === "gsmode") { lab.gs.mode = v; gsReset(); gsRender(); }
      else if (n === "pathkind") { lab.path.kind = v; pathRender(true); }
      else return false;
      $$("button", sg).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return true;
    }
    switch (b.id) {
      case "lab-seed": lab.seed = (lab.seed % 997) + 1; lab.added = []; onDataChange(); renderLabCtl(); return true;
      case "lab-clear": lab.added = []; onModelChange(true); b.disabled = true; return true;
      case "cv-play": cvPlay(); return true;
      case "cv-step": { const c = lab.cv; if (c.scores.length >= cvData().folds.length) { c.scores = []; c.cur = -1; } cvStep(); return true; }
      case "cv-all": { const c = lab.cv; clearInterval(c.timer); c.timer = null; c.scores = []; while (c.scores.length < cvData().folds.length) cvStep(); cvRender(false); return true; }
      case "gs-run": gsRun(); return true;
      case "gs-reset": gsReset(); gsRender(); return true;
      case "gs-reveal": gsReveal(); return true;
      case "path-seed": lab.path.seed = (lab.path.seed % 97) + 1; pathRender(true); return true;
    }
    return false;
  }

  function foldMini(kind) {
    const n = 20, K = kind === "loo" ? 20 : 5, W = 300, rows = kind === "repeated" ? 10 : kind === "loo" ? 8 : K, rh = 9, gap = 3, H = rows * (rh + gap) + 4;
    let fl;
    if (kind === "repeated") fl = ENG.folds("kfold-shuffle", n, 5, 1).concat(ENG.folds("kfold-shuffle", n, 5, 2));
    else if (kind === "loo") fl = ENG.range(8).map((i) => ({ val: [i], train: ENG.range(n).filter((j) => j !== i) }));
    else if (kind === "group") { const grp = ENG.range(n).map((i) => Math.floor(i / 4)), order = ENG.shuffle(ENG.range(n), ENG.rng(4)); fl = ENG.range(5).map((g) => ({ val: order.filter((i) => grp[i] === g), train: order.filter((i) => grp[i] !== g) })); fl.order = order; fl.grp = grp; }
    else fl = ENG.folds(kind, n, K, 2);
    const cw = W / n;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Schéma des folds ' + kind + '">';
    fl.slice(0, rows).forEach((F, r) => {
      const role = new Array(n).fill(0);
      const pos = fl.order ? (i) => fl.order.indexOf(i) : (i) => i;
      F.train.forEach((i) => (role[pos(i)] = 1)); F.val.forEach((i) => (role[pos(i)] = 2));
      role.forEach((ro, p) => {
        const col = ro === 2 ? "var(--c2)" : ro === 1 ? "color-mix(in oklab, var(--c1) 55%, var(--paper))" : "var(--line-2)";
        s += '<rect x="' + (p * cw + 0.6).toFixed(1) + '" y="' + (2 + r * (rh + gap)) + '" width="' + (cw - 1.2).toFixed(1) + '" height="' + rh + '" rx="1.5" style="fill:' + col + '"/>';
      });
    });
    if (kind === "group") for (let g = 1; g < 5; g++) s += '<line x1="' + g * 4 * cw + '" x2="' + g * 4 * cw + '" y1="0" y2="' + H + '" style="stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2"/>';
    return s + "</svg>";
  }
  function randomVsGrid() {
    const W = 600, H = 300, pad = 34, side = 210;

      pts.forEach((p) => (s += '<circle cx="' + (ox + p[0] * side).toFixed(1) + '" cy="' + (pad + (1 - p[1]) * side).toFixed(1) + '" r="5" style="fill:var(--c1);stroke:var(--paper);stroke-width:1.5"/>'));
      // projection sur l'axe important

    };
    const grid = [], r = ENG.rng(8), rnd = [];

    for (let i = 0; i < 9; i++) rnd.push([0.05 + 0.9 * r(), 0.05 + 0.9 * r()]);
    return '<svg viewBox="0 0 ' + W + " " + (H + 30) + '" role="img" aria-label="Neuf essais en grille ne testent que trois valeurs du paramètre important ; neuf essais aléatoires en testent neuf">' +
      panel(30, "Grille : 9 essais → 3 valeurs utiles", grid) + panel(340, "Aléatoire : 9 essais → 9 valeurs", rnd) + "</svg>";
  }

  function renderCV() {

        codeBlock("Python — règle du « 1 écart-type » (refit callable)", 'import numpy as np\n\ndef one_std_rule(cv_results):\n    """Le plus régularisé parmi ceux à moins d\'1 écart-type du meilleur."""\n    mean = cv_results["mean_test_rmse"]   # scores négatifs\n    std = cv_results["std_test_rmse"]\n    best = np.argmax(mean)\n    ok = np.flatnonzero(mean >= mean[best] - std[best])\n    alphas = np.array([p["model__alpha"] for p in cv_results["params"]])\n    return ok[np.argmax(alphas[ok])]\n\nsearch = GridSearchCV(pipe, param_grid, scoring=scoring,\n                      refit=one_std_rule, cv=cv)', "code-1se") + "</div>" +

  function outlierUpdate() {
    if (!$("#ch-out")) return;
    const e = +$("#out-e").value, r = ENG.rng(42), yt = [], yp = [];
    for (let i = 0; i < 30; i++) { const y = 50 + 10 * ENG.gauss(r); yt.push(y); yp.push(y + 2.2 * ENG.gauss(r)); }
    const met = (extra) => {
      const t = yt.concat([60]), p = yp.concat([60 + extra]);
      const res = t.map((v, i) => v - p[i]), n = res.length, ym = ENG.mean(t);
      const abs = res.map(Math.abs).sort((a, b) => a - b);
      return { mae: ENG.mean(abs), rmse: Math.sqrt(ENG.mean(res.map((v) => v * v))), medae: abs[(n - 1) / 2] != null ? abs[Math.floor(n / 2)] : 0, mape: ENG.mean(res.map((v, i) => Math.abs(v) / Math.abs(t[i]))) * 100, r2: 1 - res.reduce((s, v) => s + v * v, 0) / t.reduce((s, v) => s + (v - ym) ** 2, 0), res };
    };
    const b = met(2), c = met(e); // référence : une erreur « ordinaire » de 2
    const Pl = VIZ.Plot({ w: 560, h: 260, x: [0, 32], y: [-12, Math.max(14, e + 4)], xlabel: "prédiction n°", ylabel: "erreur y − ŷ", xticks: [1, 10, 20, 31], m: { t: 16, r: 16, b: 34, l: 44 } });
    Pl.grid(5, 5).hline(0, "stroke:var(--ink-2);stroke-width:1");
    c.res.forEach((v, i) => { const big = i === 30; Pl.seg(i + 1, 0, i + 1, -v, "stroke:" + (big ? "var(--c2)" : "var(--c1)") + ";stroke-width:" + (big ? 3 : 2)); Pl.dot(i + 1, -v, big ? 5.5 : 3.5, "fill:" + (big ? "var(--c2)" : "var(--c1)")); });
    $("#ch-out").innerHTML = Pl.svg("Erreurs des 31 prédictions ; la dernière est l'erreur réglable");
    const rows = [["RMSE", c.rmse / b.rmse, N(c.rmse, 2)], ["MAE", c.mae / b.mae, N(c.mae, 2)], ["MAPE", c.mape / b.mape, N(c.mape, 1) + " %"], ["MedAE", c.medae / b.medae, N(c.medae, 2)]];
    const mx = Math.max(...rows.map((x) => x[1]), 1.5);
    $("#out-bars").innerHTML = rows.map((x) => '<div class="dec__row"><span>' + x[0] + " ×" + N(x[1], 2) + '</span><div class="dec__bar"><i style="width:' + ((x[1] / mx) * 100).toFixed(1) + "%;background:" + (x[0] === "MedAE" ? "var(--c3)" : x[0] === "RMSE" ? "var(--c2)" : "var(--c1)") + '"></i></div><b>' + x[2] + "</b></div>").join("") +
      '<div class="dec__row"><span>R²</span><div class="dec__bar"><i style="width:' + Math.max(0, c.r2 * 100).toFixed(1) + '%;background:var(--c7)"></i></div><b>' + N(c.r2, 3) + "</b></div>";
    $("#out-read").innerHTML = fmt("Avec une erreur ordinaire (2) : RMSE " + N(b.rmse, 2) + ", MAE " + N(b.mae, 2) + ", R² " + N(b.r2, 3) + ". Une erreur de " + e + " multiplie la RMSE par " + N(c.rmse / b.rmse, 1) + " mais la MAE par seulement " + N(c.mae / b.mae, 1) + " ; la MedAE ne bouge presque pas.");
  }

  const MT = [

        "Pourquoi des carrés ? Un écart de −3 compte autant qu'un écart de +3, les grosses erreurs sont punies plus fort, et le minimum se calcule avec une formule exacte.",
        "Image mentale : sur chaque résidu, on dessine un carré. La meilleure droite est celle dont l'**aire totale des carrés** est minimale.",
      ],
      key: R`\hat w,\hat b = \arg\min_{w,b}\ \sum_{i=1}^{n}\big(y_i - (b + w\,x_i)\big)^2`, keyTxt: "RSS : residual sum of squares, somme des carrés des résidus.",
      steps: [
        { p: "Écriture matricielle : on ajoute une colonne de 1 à X pour l'intercept. Le modèle s'écrit $y = Xw + \\varepsilon$ et l'objectif devient une norme au carré.", tex: R`\mathrm{RSS}(w) = \lVert y - Xw\rVert_2^2 = (y-Xw)^\top(y-Xw)` },
        { p: "On dérive par rapport à w et on annule le gradient (la RSS est convexe : ce point est le minimum).", tex: R`\nabla_w \mathrm{RSS} = -2X^\top(y - Xw) = 0 \;\Longrightarrow\; X^\top X\,\hat w = X^\top y` },
        { p: "Si $X^\\top X$ est inversible (pas de colonnes colinéaires), la solution est unique :", tex: R`\hat w = (X^\top X)^{-1}X^\top y` },
        { p: "Avec une seule variable, cela se lit simplement : la pente est la covariance divisée par la variance, et la droite passe par le point moyen.", tex: R`\hat w = \frac{\operatorname{Cov}(x,y)}{\operatorname{Var}(x)},\qquad \hat b = \bar y - \hat w\,\bar x` },
        { p: "Géométrie : $\\hat y = X\\hat w$ est la **projection orthogonale** de y sur l'espace engendré par les colonnes de X. Le résidu est perpendiculaire à chaque colonne ; avec un intercept, la somme des résidus est donc nulle.", tex: R`X^\top(y - \hat y) = 0 \;\Rightarrow\; \textstyle\sum_i e_i = 0` },

        { p: "Les lignes de niveau de L sont des **ellipses** dont la forme dépend de $\\tfrac1n X^\\top X$. Si les variables ont des échelles très différentes (ou une moyenne loin de 0), les ellipses sont très allongées : le gradient zigzague.", tex: R`\kappa = \frac{\lambda_{\max}\big(\tfrac1n X^\top X\big)}{\lambda_{\min}\big(\tfrac1n X^\top X\big)}\ \text{(conditionnement)}` },

  /* ------------------------------------------------------------ widgets */
  const W = {};
  const wrap = (title, pill, body) => '<div class="widget"><div class="widget__head">' + ICON.flask + "<h4>" + title + "</h4>" + (pill ? '<span class="pill">' + pill + "</span>" : "") + "</div>" + body + "</div>";

  // Moindres carrés « à la main »
  const LSQ = (() => {
    const r = ENG.rng(12), x = [], y = [];
    for (let i = 0; i < 12; i++) { const xi = 0.5 + i * 0.8 + (r() - 0.5) * 0.4; x.push(xi); y.push(1.2 + 0.55 * xi + 0.7 * ENG.gauss(r)); }
    const f = ENG.fit("poly", x.map((v) => v / 10), y, { degree: 1 });
    const b0 = f(0), w0 = (f(0.1) - f(0)) / 1; // x mis à l'échelle /10 pour le moteur
    return { x, y, w: w0, b: b0 };
  })();
  const sse = (w, b) => LSQ.x.reduce((s, x, i) => s + (LSQ.y[i] - (b + w * x)) ** 2, 0);
  W.lsq = {
    st: { w: 0.2, b: 2.4, sq: true, opt: false },
    html() {

        rangeCtl("lsq-w", "Pente w", { min: -0.5, max: 1.5, step: 0.01, value: s.w, out: N(s.w, 2) }) +

        '<button type="button" class="btn btn--accent" id="lsq-fit">' + ICON.target + "<span>Ajuster par moindres carrés</span></button>" +
        '<div class="readout" id="lsq-read"></div></div></div>');
    },
    draw() {
      const s = this.st, Pl = VIZ.Plot({ w: 560, h: 330, x: [0, 10], y: [-1, 9], xlabel: "x", ylabel: "y", m: { t: 14, r: 14, b: 32, l: 36 } });
      Pl.grid(6, 5);
      const ux = (Pl.x(1) - Pl.x(0)), uy = (Pl.y(0) - Pl.y(1));
      if (s.sq) LSQ.x.forEach((x, i) => {
        const yh = s.b + s.w * x, d = LSQ.y[i] - yh, side = (Math.abs(d) * uy) / ux;
        Pl.rect(x, yh, x + (d > 0 ? -side : side), LSQ.y[i], "fill:var(--c-err);fill-opacity:.1;stroke:var(--c-err);stroke-opacity:.5;stroke-width:1");
      });
      if (s.opt) Pl.path([[0, LSQ.b], [10, LSQ.b + LSQ.w * 10]], "stroke:var(--c3);stroke-width:2;stroke-dasharray:6 4");

      const e = sse(s.w, s.b), e0 = sse(LSQ.w, LSQ.b), ym = ENG.mean(LSQ.y), sst = LSQ.y.reduce((a, v) => a + (v - ym) ** 2, 0);
      $("#lsq-read").innerHTML = "<span>Votre aire (RSS) : <b>" + N(e, 2) + "</b></span><span>Minimum possible : <b>" + N(e0, 2) + "</b> (×" + N(e / e0, 2) + ")</span><span>R² de votre droite : <b>" + N(1 - e / sst, 3) + "</b></span>" + (e / e0 < 1.005 ? '<span class="badge badge--ok">' + ICON.check + "Optimum atteint</span>" : "");

  // Descente de gradient
  const GD = (() => {
    const r = ENG.rng(5), x = [], y = [];
    for (let i = 0; i < 30; i++) { const xi = 2 + 6 * r(); x.push(xi); y.push(1 + 0.6 * xi + 0.5 * ENG.gauss(r)); }
    const xm = ENG.mean(x), xs = ENG.std(x);
    const setup = (scaled) => {
      const X = x.map((v) => (scaled ? (v - xm) / xs : v)), n = X.length;
      const M = [[1, ENG.mean(X)], [ENG.mean(X), ENG.mean(X.map((v) => v * v))]];
      const v = [ENG.mean(y), ENG.mean(X.map((xx, i) => xx * y[i]))];
      const th = ENG.solve(M, v);
      const L = (t) => ENG.mean(X.map((xx, i) => (y[i] - t[0] - t[1] * xx) ** 2));
      const tr = M[0][0] + M[1][1], det = M[0][0] * M[1][1] - M[0][1] * M[1][0], disc = Math.sqrt(tr * tr / 4 - det);
      const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
      const e1 = Math.abs(M[0][1]) > 1e-12 ? [l1 - M[1][1], M[0][1]] : [1, 0], nn = Math.hypot(e1[0], e1[1]);
      return { M, v, th, L, Lmin: L(th), l1, l2, e1: [e1[0] / nn, e1[1] / nn], n };
    };
    return { raw: setup(false), sc: setup(true) };
  })();
  W.gd = {
    st: { lr: 0.02, steps: 60, scaled: false },
    html() {
      const s = this.st;
      return wrap("Descente de gradient sur la surface d'erreur", "interactif",

        '<div class="field" style="min-width:220px">' + rangeCtl("gd-steps", "Itérations", { min: 0, max: 200, value: s.steps, out: s.steps }) + "</div></div>" +
        '<div class="cols2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div class="chart" id="w-gd"></div><div class="stack"><div class="chart" id="w-gdl"></div><div class="readout" id="gd-read"></div></div></div>');
    },
    draw() {
      const s = this.st, G = s.scaled ? GD.sc : GD.raw, th = G.th;
      const hb = 3.5, hw = s.scaled ? 3.5 : 0.75;
      const Pl = VIZ.Plot({ w: 560, h: 360, x: [th[0] - hb, th[0] + hb], y: [th[1] - hw, th[1] + hw], xlabel: "b (intercept)", ylabel: "w (pente)", m: { t: 16, r: 14, b: 34, l: 44 } });
      Pl.grid(6, 6);
      const e1 = G.e1, e2 = [-e1[1], e1[0]];
      [0.02, 0.08, 0.25, 0.6, 1.2, 2.4, 4.5, 8].forEach((c, k) => {
        const pts = ENG.range(181).map((i) => { const ph = (2 * Math.PI * i) / 180, a = Math.sqrt(c / G.l1) * Math.cos(ph), b = Math.sqrt(c / G.l2) * Math.sin(ph); return [th[0] + a * e1[0] + b * e2[0], th[1] + a * e1[1] + b * e2[1]]; });

      const lo = Math.max(1e-6, Math.min(...losses.filter(isFinite)) - G.Lmin);

    st: { kind: "l1", t: 1.2, rho: 0.35, b: [2.1, 0.9], r: 0.5 },
    html() {

      return wrap("Pourquoi le Lasso produit des zéros : la géométrie", "glisser le point",
        '<div class="b-opts"><div class="field"><span class="lab">Pénalité</span>' + seg("geokind", s.kind, [["l2", "L2 (Ridge)"], ["l1", "L1 (Lasso)"], ["en", "Elastic Net"]]) + "</div>" +
        '<div class="field" style="min-width:200px">' + rangeCtl("geo-t", "Budget t", { min: 0.2, max: 2.6, step: 0.02, value: s.t, out: N(s.t, 2) }) + "</div>" +
        '<div class="field" style="min-width:200px">' + rangeCtl("geo-rho", "Corrélation des variables", { min: -0.85, max: 0.85, step: 0.05, value: s.rho, out: N(s.rho, 2) }) + "</div></div>" +
        '<div class="wgrid"><div class="chart" id="w-geo" style="touch-action:none"></div><div class="stack"><div class="readout" id="geo-read"></div><p class="note">Faites glisser le point ŵ<sub>OLS</sub>. Les ellipses sont les lignes de niveau de l\'erreur ; la solution pénalisée est le premier point de la région colorée qu\'elles touchent. Avec L1, ce point tombe souvent sur un coin : un coefficient vaut exactement 0.</p></div></div>');
    },
    solve() {
      const s = this.st, A = [[1, s.rho], [s.rho, 1]];
      const Q = (p) => { const d0 = p[0] - s.b[0], d1 = p[1] - s.b[1]; return A[0][0] * d0 * d0 + 2 * A[0][1] * d0 * d1 + A[1][1] * d1 * d1; };
      const norm = (a, b) => s.kind === "l1" ? Math.abs(a) + Math.abs(b) : s.kind === "l2" ? Math.hypot(a, b) : s.r * (Math.abs(a) + Math.abs(b)) + (1 - s.r) * Math.hypot(a, b);
      if (norm(s.b[0], s.b[1]) <= s.t) return { p: s.b.slice(), Q, inside: true };

      Pl.dot(sol.p[0], sol.p[1], 6.5, "fill:var(--c-fit);stroke:var(--paper);stroke-width:2");
      const el = $("#w-geo");
      el.innerHTML = Pl.svg("Région de contrainte, lignes de niveau de l'erreur et solution pénalisée");
      const zero = (v) => Math.abs(v) < 0.012;

        (sol.inside ? '<span class="badge badge--info">' + ICON.info + "ŵ OLS est dans le budget : pas de rétrécissement</span>" : zero(sol.p[0]) || zero(sol.p[1]) ? '<span class="badge badge--ok">' + ICON.check + "Contact sur un coin : un coefficient vaut 0</span>" : '<span class="badge badge--warn">' + ICON.info + "Contact sur un bord : les deux coefficients sont rétrécis</span>");

  };

  // Choix d'un seuil de coupure
  const SPL = (() => {

  })();
  const sseOf = (ys) => { if (!ys.length) return 0; const m = ENG.mean(ys); return ys.reduce((s, v) => s + (v - m) ** 2, 0); };
  W.split = {
    st: { s: 0.25 },
    html() {
      return wrap("Trouver la meilleure question : balayer les seuils", "interactif",
        '<div class="b-opts"><div class="field" style="min-width:260px">' + rangeCtl("sp-s", "Seuil s", { min: 0.02, max: 0.98, step: 0.005, value: this.st.s, out: N(this.st.s, 3) }) + '</div><button type="button" class="btn btn--accent" id="sp-best">' + ICON.target + "<span>Meilleur seuil</span></button></div>" +
        '<div class="wgrid"><div class="stack"><div class="chart" id="w-sp"></div><div class="chart" id="w-spc"></div></div><div class="readout" id="sp-read"></div></div>');
    },
    curve() {
      const out = [];
      for (let i = 1; i < SPL.x.length; i++) { const s = (SPL.x[i - 1] + SPL.x[i]) / 2; out.push([s, sseOf(SPL.y.slice(0, i)) + sseOf(SPL.y.slice(i))]); }

    },
    draw() {

      const mL = L.length ? ENG.mean(L) : NaN, mR = Rr.length ? ENG.mean(Rr) : NaN;
      const Pl = VIZ.Plot({ w: 560, h: 260, x: [0, 1], y: [0, 3.8], xlabel: "x", ylabel: "y", m: { t: 14, r: 14, b: 32, l: 36 } });
      Pl.grid(6, 4);
      SPL.x.forEach((x, i) => { const m = x <= s ? mL : mR; Pl.seg(x, SPL.y[i], x, m, "stroke:var(--c-err);stroke-opacity:.5;stroke-width:1.2"); });
      if (L.length) Pl.seg(0, mL, s, mL, "stroke:var(--c1);stroke-width:3");

    },
    draw() {

      const fns = s.grad
        ? [[(r) => 2 * r, "--c1"], [(r) => Math.sign(r), "--c2"], [(r) => Math.max(-d, Math.min(d, r)), "--c3"], [(r) => (r > 0 ? t : t - 1), "--c7"]]
        : [[(r) => r * r, "--c1"], [(r) => Math.abs(r), "--c2"], [(r) => (Math.abs(r) <= d ? 0.5 * r * r : d * (Math.abs(r) - 0.5 * d)), "--c3"], [(r) => Math.max(t * r, (t - 1) * r), "--c7"]];
      const Pl = VIZ.Plot({ w: 560, h: 320, x: [-3, 3], y: s.grad ? [-3.2, 3.2] : [0, 4.5], xlabel: "résidu r = y − ŷ", ylabel: s.grad ? "dérivée (ce que le boosting ajuste)" : "perte", m: { t: 16, r: 14, b: 34, l: 40 } });

      });
      $("#lo-read").innerHTML = s.grad ? "Gradient du carré : proportionnel à l'erreur (un aberrant tire fort). Absolue : ±1, quelle que soit la taille de l'erreur. Huber : proportionnel puis plafonné à ±δ. Quantile : τ au-dessus, τ − 1 en dessous." : "Au-delà de δ, Huber croît linéairement comme la perte absolue : un aberrant pèse beaucoup moins qu'avec le carré. La perte quantile est asymétrique : avec τ = " + N(t, 2) + ", sous-estimer coûte " + N(t / (1 - t), 1) + "× plus que surestimer.";

  // Biais du gagnant
  W.optim = {
    st: { n: 40, k: 5, seed: 1 },
    html() {
      const s = this.st;
      return wrap("Le biais du gagnant : N configurations aussi bonnes les unes que les autres", "simulation",
        '<div class="b-opts"><div class="field" style="min-width:220px">' + rangeCtl("op-n", "Configurations testées N", { min: 1, max: 200, value: s.n, out: s.n }) + '</div><div class="field" style="min-width:200px">' + rangeCtl("op-k", "Folds K", { min: 2, max: 20, value: s.k, out: s.k }) + '</div><button type="button" class="btn" id="op-seed">' + ICON.dice + "<span>Nouveau tirage</span></button></div>" +
        '<div class="wgrid"><div class="chart" id="w-op"></div><div class="readout" id="op-read"></div></div>');
    },
    draw() {
      const s = this.st, r = ENG.rng(s.seed * 13 + 1), sdFold = 0.18, est = [];
      for (let j = 0; j < s.n; j++) { let m = 0; for (let k = 0; k < s.k; k++) m += 1 + sdFold * ENG.gauss(r); est.push(m / s.k); }
      const best = est.reduce((a, v, i) => (v < est[a] ? i : a), 0);
      const Pl = VIZ.Plot({ w: 560, h: 280, x: [0, Math.max(2, s.n + 1)], y: [0.7, 1.3], xlabel: "configuration", ylabel: "RMSE estimée par CV", m: { t: 16, r: 14, b: 34, l: 44 } });
      Pl.grid(5, 6).hline(1, "stroke:var(--ink);stroke-width:1.6;stroke-dasharray:6 4", "vraie RMSE = 1 pour toutes");
      est.forEach((v, i) => Pl.dot(i + 1, v, i === best ? 7 : 3.6, i === best ? "fill:var(--c2);stroke:var(--paper);stroke-width:2" : "fill:var(--c1);fill-opacity:.7"));
      $("#w-op").innerHTML = Pl.svg("Estimations de CV de configurations identiques ; la meilleure est en orange");
      $("#op-read").innerHTML = "<span>Meilleure estimation (« best_score_ ») : <b>" + N(est[best], 3) + "</b></span><span>Vraie valeur : <b>1,000</b></span><span>Optimisme : <b>" + N((1 - est[best]) * 100, 1) + " %</b></span><p class=\"note\">Toutes les configurations sont identiques : seule la chance les départage. Plus N est grand, plus le gagnant est flatteur ; plus K est grand, moins chaque estimation est bruitée. D'où l'importance d'un test final tenu à l'écart.</p>";
    },
    init() { this.draw(); },
    input(t) {

      else return false;
      this.draw(); return true;
    },

  };

    state.mode = mode; persist();

    if (state.view === "maths" && mode === "detailed") initMathWidgets();
  }
  function copyFrom(btn) {
    const pre = document.getElementById(btn.dataset.copy); if (!pre) return;
    const label = $("span", btn);
    const done = (txt) => { label.textContent = txt; btn.classList.add("is-done"); setTimeout(() => { label.textContent = "Copier"; btn.classList.remove("is-done"); }, 1600); };
    const text = pre.innerText;
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand("copy"); done("Copié"); } catch (e) { done("Sélectionné"); }
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done("Copié"), fallback);
    else fallback();
  }

  document.addEventListener("click", (e) => {
    const t = e.target;
    const v = t.closest("button[data-view]"); if (v) { setView(v.dataset.view); return; }
    const tab = t.closest("button[data-m]"); if (tab) { setModel(tab.dataset.m); return; }
    const md = t.closest("button[data-mode]"); if (md) { setMode(md.dataset.mode); return; }
    const ms = t.closest("[data-mode-switch]"); if (ms) { const sec = ms.closest(".sec"); setMode(ms.dataset.modeSwitch); if (sec) sec.scrollIntoView({ block: "start" }); return; }
    if (t.closest("#theme-btn")) { cycleTheme(); return; }
    const j = t.closest("[data-jump]"); if (j) { const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    const c = t.closest("[data-copy]"); if (c) { copyFrom(c); return; }
    const ol = t.closest("[data-open-lab]"); if (ol) { lab.model = ol.dataset.openLab; lab.sweep = null; setView("lab"); return; }
    const gl = t.closest("[data-goto-lab]"); if (gl) { setView("lab", gl.dataset.gotoLab); return; }
    const gf = t.closest("[data-goto-fiche]"); if (gf) { state.model = gf.dataset.gotoFiche; setView("models"); return; }
    const pd = t.closest("[data-pd]");
    if (pd) {
      const open = state.open[state.model] || (state.open[state.model] = {});
      const n = pd.dataset.pd, on = pd.getAttribute("aria-expanded") !== "true";
      open[n] = on; pd.setAttribute("aria-expanded", String(on));
      document.getElementById(pd.getAttribute("aria-controls")).hidden = !on;
      pd.closest("tr").classList.toggle("is-open", on);
      return;
    }
    // constructeur
    const chip = t.closest("[data-chip]");
    if (chip) {
      const st = B(), n = chip.dataset.chip, val = chip.dataset.v, arr = st.sel[n], i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
      chip.setAttribute("aria-pressed", String(i < 0)); refreshBuilder(); return;
    }
    const add = t.closest("[data-add]"); if (add) { addValue(add.dataset.add); return; }
    const bp = t.closest("[data-bpreset]");
    if (bp) {
      const m = byId(state.model), st = B(), k = bp.dataset.bpreset;
      m.params.forEach((p) => { st.sel[p.n] = k === "none" ? [] : k === "p1" ? (p.prio === 1 ? p.start.slice() : []) : p.pre ? p.start.slice() : []; });
      $("#b-rows").innerHTML = builderRows(m, st); refreshBuilder(); return;
    }
    const sg = t.closest("[data-seg] button");
    if (sg && state.view === "models") {
      const name = sg.closest("[data-seg]").dataset.seg, val = sg.dataset.val;
      if (name === "search" || name === "codeMode") {
        state.opts[name] = val; persist();
        $$("button", sg.parentNode).forEach((x) => x.setAttribute("aria-pressed", String(x === sg)));
        const f = $("#f-niter"); if (f) f.hidden = state.opts.search !== "random";
        refreshBuilder(); return;
      }
    }
    if (state.view === "lab" && labClick(e)) return;
    if (state.view === "maths") { const b = t.closest("button"); if (b && mathClick(b)) return; }
  });
  function addValue(n) {
    const m = byId(state.model), p = m.params.find((x) => x.n === n), st = B(), inp = document.getElementById("add-" + n);
    const row = inp.closest(".brow"), err = $(".brow__err", row);
    const r = validate(p, inp.value);
    if (r.err) { err.textContent = r.err; err.hidden = false; return; }
    err.hidden = true;
    if (!cands(p, st).includes(r.v)) st.custom[n].push(r.v);
    if (!st.sel[n].includes(r.v)) st.sel[n].push(r.v);
    $("#b-rows").innerHTML = builderRows(m, st); refreshBuilder();
    const again = document.getElementById("add-" + n); if (again) again.focus();
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.addin) { e.preventDefault(); addValue(e.target.dataset.addin); }
    const tab = e.target.closest && e.target.closest(".tab");
    if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const ids = MODELS.map((m) => m.id), i = ids.indexOf(state.model);
      setModel(ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length], true);
      e.preventDefault();
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "ref-q") {
      const q = t.value.trim().toLowerCase(); let n = 0;
      $$(".rrow").forEach((r) => { const ok = !q || r.dataset.s.includes(q); r.hidden = !ok; if (ok) n++; });
      $$(".rtable tr.grp").forEach((g) => { let s = g.nextElementSibling, any = false; while (s && !s.classList.contains("grp")) { if (!s.hidden) any = true; s = s.nextElementSibling; } g.hidden = !any; });
      $("#ref-n").textContent = n + " paramètre" + (n > 1 ? "s" : "");
      return;
    }
    if (t.id === "opt-folds" || t.id === "opt-niter") {
      const v = parseInt(t.value, 10);
      if (t.id === "opt-folds" && v >= 2 && v <= 20) state.opts.folds = v;
      if (t.id === "opt-niter" && v >= 1 && v <= 5000) state.opts.nIter = v;
      persist(); refreshBuilder(); return;
    }
    if (t.id === "out-e") { $("#out-e-o").textContent = t.value; outlierUpdate(); return; }
    if (state.view === "lab" && labInput(e)) return;
    if (state.view === "maths") mathInput(t);
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "opt-cv" || t.id === "opt-refit" || t.id === "opt-target") { state.opts[t.id.slice(4)] = t.value; persist(); refreshBuilder(); return; }
    if (state.view === "lab" && labChange(e)) return;
    if (state.view === "maths" && t.type === "checkbox") mathInput(t);
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  window.addEventListener("resize", debounce(() => document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px"), 150));

  /* ----------------------------------------------------------- démarrage */
  const fromHash = readHash();
  if (!location.hash && saved.view && HASH[saved.view]) state.view = saved.view;
  themeIcon();
  render(state.view === "maths" && fromHash ? fromHash : null);
})();
</script>
</body>
</html>
